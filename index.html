let migWrote=false;
function normalize(){
  if(!store.program||!store.program.length) store.program=seed();
  if(!store.days) store.days={};
  if(!store.weights) store.weights=[];
  if(!store.measures) store.measures=[];
  /* one-off: the tick-a-meal list is replaced by a weighed food log. Runs once,
     so a list the user has since edited is never rebuilt. */
  store.mig=store.mig||{};
  if(!store.mig.food1){ delete store.meals; delete store.food; store.mig.food1=1; }
  if(!store.lib||!store.lib.length) store.lib=seedLib();
  if(!store.diet) store.diet=seedDiet();
  /* one-off: the day used to turn over at midnight. It is closed by hand now, so
     move each stored date into the closed list and keep today's as the open one. */
  if(!store.mig.food2){
    store.eatLog=Array.isArray(store.eatLog)?store.eatLog:[];
    if(store.eat&&typeof store.eat==="object"){
      Object.keys(store.eat).sort().forEach(d=>{
        const rows=store.eat[d];
        if(!Array.isArray(rows)||!rows.length) return;
        if(d===iso()) store.eatNow={start:Date.now(),rows:rows};
        else store.eatLog.push({d:d,start:0,end:0,rows:rows});
      });
    }
    delete store.eat;
    store.mig.food2=1;
  }
  /* one-off: the list labels are in English now; the food names stay as they are */
  if(!store.mig.food3){
    const MAP={"\u0628\u0631\u0648\u062a\u064a\u0646":"Protein","\u0646\u0634\u0648\u064a\u0627\u062a":"Carbs","\u0623\u0644\u0628\u0627\u0646":"Dairy",
      "\u0641\u0627\u0643\u0647\u0629 \u0648\u062e\u0636\u0627\u0631":"Fruit & veg","\u0645\u0643\u0633\u0631\u0627\u062a \u0648\u062f\u0647\u0648\u0646":"Nuts & fats","\u062a\u0627\u0646\u064a":"Other"};
    (store.lib||[]).forEach(x=>{ if(x&&MAP[x.c]) x.c=MAP[x.c]; });
    store.mig.food3=1;
  }
  /* one-off: both powders were entered from memory before the tubs were read.
     The protein scoop is now his weighed 37 g off a 90.7% label. */
  if(!store.mig.food4){
    const FIX={"\u0633\u0643\u0648\u0628 \u0628\u0631\u0648\u062a\u064a\u0646":[137,33.6,0.1,0.6],"\u0633\u0643\u0648\u0628 \u0645\u0627\u0643\u0631\u0648 \u0643\u0627\u0631\u0628":[174,0,0,43.2]};
    (store.lib||[]).forEach(x=>{
      const v=x&&FIX[x.n];
      if(v){ x.k=v[0]; x.p=v[1]; x.f=v[2]; x.b=v[3]; }
    });
    store.mig.food4=1;
  }
  /* one-off: the grilled plate, added after the fact, for a list already seeded */
  if(!store.mig.food5){
    const ADD=[["\u0643\u0641\u062a\u0629 \u0644\u062d\u0645\u0629 \u2014 \u0635\u0628\u0627\u0639",186,14,13,2],["\u0643\u0641\u062a\u0629 \u0641\u0631\u0627\u062e \u2014 \u0635\u0628\u0627\u0639",147,15,9,2],
               ["\u0634\u064a\u0634 \u0637\u0627\u0648\u0648\u0642 \u2014 \u0633\u064a\u062e",209,32,8,2],["\u0633\u064a\u062e \u0644\u062d\u0645\u0629",253,31,13,0]];
    store.lib=store.lib||[];
    ADD.forEach(a=>{
      if(store.lib.some(x=>x&&x.n===a[0])) return;
      store.lib.push({id:uid(),c:"Protein",n:a[0],u:"pc",k:a[1],p:a[2],f:a[3],b:a[4]});
    });
    store.mig.food5=1;
  }
  /* one-off: switch carb cycling on at 50 g. It runs once, so turning it off
     later in Edit stays off. */
  if(!store.mig.food6){
    store.diet=Object.assign(seedDiet(),store.diet||{});
    if(!(+store.diet.shift>0)) store.diet.shift=50;
    store.mig.food6=1;
  }
  /* Everything added by hand landed in Other, so the ones already there get put
     where they belong and the breaded chicken breast he air-fries is added. Only
     items still sitting in Other are touched, so a category he has since set by
     hand is never overwritten. Anything in Other this does not recognise stays
     there - a wrong guess would just hide the food somewhere he is not looking. */
  if(!store.mig.food7){
    store.lib=store.lib||[];
    const MOVE=[["عسل","Carbs"],["معمول","Snacks"]];
    store.lib.forEach(x=>{
      if(!x||(x.c&&x.c!=="Other")) return;
      const n=String(x.n||"");
      for(let i=0;i<MOVE.length;i++) if(n.indexOf(MOVE[i][0])===0){ x.c=MOVE[i][1]; return; }
    });
    const PAN="بانيه";
    if(!store.lib.some(x=>x&&String(x.n||"").indexOf(PAN)>=0))
      store.lib.push({id:uid(),c:"Protein",n:PAN,u:"g",k:220,p:27,f:6,b:11});
    store.mig.food7=1;
    migWrote=true;
  }
  /* The empty rows left behind by the old behaviour. Anything holding a number,
     even half of one, stays — so a weight with no reps is kept, not tidied away. */
  if(!store.mig.sess1){
    let dropped=0;
    Object.keys(store.days||{}).forEach(id=>{
      const d=store.days[id]; if(!d||!Array.isArray(d.sessions)) return;
      const n=d.sessions.length;
      d.sessions=d.sessions.filter(x=>sessAny(x));
      dropped+=n-d.sessions.length;
    });
    store.mig.sess1=1;
    /* persist straight away, or closing the app would leave the rows behind
       and the sweep would have to run all over again */
    if(dropped) migWrote=true;
  }
  if(!Array.isArray(store.eatLog)) store.eatLog=[];
  if(!Array.isArray(store.combo)) store.combo=[];
  if(!Array.isArray(store.pins)) store.pins=[];
  if(!store.eatNow||!Array.isArray(store.eatNow.rows)) store.eatNow={start:Date.now(),rows:[]};
  // keep the closed list small: the last 60 days
  while(store.eatLog.length>60) store.eatLog.shift();
  const ref={};
  seed().forEach(p=>p.ex.forEach(e=>{ ref[e.n]={m:e.m,h:e.h}; }));
  store.program.forEach(p=>p.ex.forEach(e=>{
    if(!e.m){ const r=ref[e.n]; e.m=r?r.m:"other"; e.h=r?r.h:"general"; }
  }));
  /* one-off: direct arm volume was the thinnest part of the program.
     Runs once, skips anything already there, and never comes back if deleted. */
  store.mig=store.mig||{};
  if(!store.mig.arm1){
    const addEx=(dayId,name,sets,reps,rest,why,m,h)=>{
      const d=store.program.find(p=>p.id===dayId); if(!d||!d.ex) return;
      const nm=name.toLowerCase().replace(/\s+/g," ").trim();
      if(d.ex.some(e=>(e.n||"").toLowerCase().replace(/\s+/g," ").trim()===nm)) return;
      let i=1; while(d.ex.some(e=>e.id===dayId+"-m"+i)) i++;
      d.ex.push({id:dayId+"-m"+i,n:name,s:sets,r:reps,rest:rest,why:why,m:m,h:h});
    };
    addEx("wed","Hammer Curl",3,"10-12",60,"Brachialis, pushes the biceps up","biceps","mid");
    addEx("sun","Overhead Rope Extension",3,"10-12",60,"Triceps long head, in stretch","triceps","long");
    store.mig.arm1=1;
  }
  /* one-off: exercise order. The lagging work was always landing last, when
     there is nothing left to give it. Renames keep the exercise id, so the
     logged history stays attached. Skips anything already moved or deleted. */
  if(!store.mig.order1){
    const K=s=>(s||"").toLowerCase().replace(/\s+/g," ").trim();
    const find=(dayId,name)=>{
      const d=store.program.find(p=>p.id===dayId);
      if(!d||!d.ex) return null;
      return d.ex.find(x=>K(x.n)===K(name))||null;
    };
    const rename=(dayId,from,to,why)=>{ const e=find(dayId,from); if(e){ e.n=to; if(why) e.why=why; } };
    const note=(dayId,name,why)=>{ const e=find(dayId,name); if(e) e.why=why; };
    const add=(dayId,name,sets,reps,rest,why,m,h)=>{
      const d=store.program.find(p=>p.id===dayId); if(!d||!d.ex) return;
      if(d.ex.some(x=>K(x.n)===K(name))) return;
      let i=1; while(d.ex.some(x=>x.id===dayId+"-o"+i)) i++;
      d.ex.push({id:dayId+"-o"+i,n:name,s:sets,r:reps,rest:rest,why:why,m:m,h:h});
    };
    const order=(dayId,names)=>{
      const d=store.program.find(p=>p.id===dayId); if(!d||!d.ex) return;
      const want=names.map(K);
      d.ex=d.ex.map((e,i)=>({e:e,i:i})).sort((a,b)=>{
        const ra=want.indexOf(K(a.e.n)), rb=want.indexOf(K(b.e.n));
        const xa=ra<0?999:ra, xb=rb<0?999:rb;
        return xa!==xb?xa-xb:a.i-b.i;   /* anything unknown keeps its place at the end */
      }).map(x=>x.e);
    };

    add("sun","Preacher Curl",3,"10-12",60,"Short head - arm in front of the body","biceps","short");

    rename("wed","Wide Lat Pulldown","Neutral Grip Lat Pulldown",
           "Neutral close (V-handle) - lower lats, not a repeat of #1");
    note("wed","Wide Grip Pull-up / Lat Pulldown","Overhand, wide - back width");
    note("wed","Chest-Supported Row","Overhand, shoulder width - back thickness");
    note("wed","Cable Curl","Underhand, shoulder width - biceps");
    note("wed","Straight-Arm Pulldown","Overhand, arms locked straight - lats only");
    note("wed","Hammer Curl","Neutral grip - brachialis under the biceps");
    note("wed","Cable Face Pull","Rope, overhand - rear delt and shoulder health");
    note("fri","Shrugs","Traps - last, it burns your grip");

    order("sun",["Flat Chest Press (Smith)","Incline Chest Press","Preacher Curl","Shoulder Press",
                 "Overhead Rope Extension","Cable / Machine Fly","DB Side Lateral","Triceps Cable Pushdown"]);
    order("tue",["Narrow Hack Squat","Romanian Deadlift","Leg Extension","Leg Curl",
                 "hip adduction","Calf Raise","Abdominal Machine"]);
    order("wed",["Wide Grip Pull-up / Lat Pulldown","Chest-Supported Row","Neutral Grip Lat Pulldown",
                 "Cable Curl","Straight-Arm Pulldown","Hammer Curl","Cable Face Pull"]);
    order("fri",["Incline Press (DB)","Close Grip Cable Row","Incline DB Curl","Dips (Machine)",
                 "Overhead Cable Triceps","DB Side Laterals","Rear Delt Fly","One-Arm Cable Pushdown","Shrugs"]);
    store.mig.order1=1;
  }
}

/* Merge a backup into what is already here: add what is missing, never
   overwrite and never delete. Returns counts of what was added. */
function mergeIn(d){
  const n={ex:0,sessions:0,sets:0,weights:0,measures:0,lib:0,eat:0,days:0};
  const clone=x=>JSON.parse(JSON.stringify(x));

  if(Array.isArray(d.program)){
    store.program=store.program||[];
    d.program.forEach(ip=>{
      if(!ip||!ip.id) return;
      let cp=store.program.find(x=>x.id===ip.id);
      if(!cp){ store.program.push(clone(ip)); n.days++; n.ex+=(ip.ex||[]).length; return; }
      cp.ex=cp.ex||[];
      (ip.ex||[]).forEach(ie=>{
        if(ie&&ie.id&&!cp.ex.some(e=>e.id===ie.id)){ cp.ex.push(clone(ie)); n.ex++; }
      });
    });
  }

  if(Array.isArray(d.pins)&&!pinsOf().length&&d.pins.length){
    store.pins=clone(d.pins);
  }
  if(Array.isArray(d.combo)){
    store.combo=Array.isArray(store.combo)?store.combo:[];
    d.combo.forEach(c=>{
      if(!c||!c.id||!Array.isArray(c.rows)||!c.rows.length) return;
      if(store.combo.some(x=>x.id===c.id)) return;
      store.combo.push(clone(c)); n.lib++;
    });
  }
  if(Array.isArray(d.lib)){
    store.lib=store.lib||[];
    d.lib.forEach(im=>{
      if(im&&im.id&&!store.lib.some(m=>m.id===im.id)){ store.lib.push(clone(im)); n.lib++; }
    });
  }
  if(d.diet&&typeof d.diet==="object"&&!store.diet) store.diet=clone(d.diet);

  if(d.days&&typeof d.days==="object"){
    store.days=store.days||{};
    Object.keys(d.days).forEach(k=>{
      const inc=((((d.days[k]||{}).sessions)||[])).filter(x=>x&&x.date);
      if(!inc.length) return;                       // nothing usable: do not create the day
      const dst=store.days[k]=store.days[k]||{sessions:[]};
      dst.sessions=dst.sessions||[];
      inc.forEach(is=>{
        const cs=dst.sessions.find(x=>x.date===is.date);
        if(!cs){ dst.sessions.push(clone(is)); n.sessions++; n.sets+=Object.keys(is.ex||{}).length; return; }
        cs.ex=cs.ex||{};
        Object.keys(is.ex||{}).forEach(id=>{
          if(!(id in cs.ex)){ cs.ex[id]=clone(is.ex[id]); n.sets++; }
        });
      });
      dst.sessions.sort((a,b)=>a.date<b.date?-1:1);
    });
  }

  if(Array.isArray(d.weights)){
    store.weights=store.weights||[];
    d.weights.forEach(w=>{
      if(w&&w.d&&isFinite(+w.v)&&!store.weights.some(x=>x.d===w.d)){
        store.weights.push({d:w.d,v:+w.v}); n.weights++;
      }
    });
    store.weights.sort((a,b)=>a.d<b.d?-1:1);
  }

  if(!store.height&&d.height) store.height=d.height;
  if(Array.isArray(d.measures)){
    store.measures=store.measures||[];
    d.measures.forEach(m=>{
      if(m&&m.d&&!store.measures.some(x=>x.d===m.d)){ store.measures.push(clone(m)); n.measures++; }
    });
    store.measures.sort((a,b)=>a.d<b.d?-1:1);
  }

  if(Array.isArray(d.eatLog)){
    store.eatLog=Array.isArray(store.eatLog)?store.eatLog:[];
    d.eatLog.forEach(x=>{
      if(!x||!x.d||!Array.isArray(x.rows)||!x.rows.length) return;
      // a day already closed here is never added twice
      if(store.eatLog.some(y=>y.d===x.d)) return;
      store.eatLog.push(clone(x)); n.eat+=x.rows.length;
    });
    store.eatLog.sort((a,b)=>a.d<b.d?-1:1);
  }
  /* an older backup may still hold the date-keyed shape */
  if(d.eat&&typeof d.eat==="object"){
    store.eatLog=Array.isArray(store.eatLog)?store.eatLog:[];
    Object.keys(d.eat).sort().forEach(dt=>{
      const inc=d.eat[dt];
      if(!Array.isArray(inc)||!inc.length) return;
      if(store.eatLog.some(y=>y.d===dt)) return;
      store.eatLog.push({d:dt,start:0,end:0,rows:clone(inc)}); n.eat+=inc.length;
    });
    store.eatLog.sort((a,b)=>a.d<b.d?-1:1);
  }
  if(d.eatNow&&Array.isArray(d.eatNow.rows)&&d.eatNow.rows.length
     &&!(store.eatNow&&Array.isArray(store.eatNow.rows)&&store.eatNow.rows.length)){
    store.eatNow=clone(d.eatNow); n.eat+=d.eatNow.rows.length;
  }

  if(d.bk) store.bk=Math.max(store.bk||0,d.bk);
  return n;
}

/* ================= public API ================= */
const API={
  async init(){
    const raw=await Store.readLocal();
    if(raw){ try{ store=JSON.parse(raw); }catch(e){ store={}; } }
    normalize();
    const map={0:"sun",2:"tue",3:"wed",5:"fri"};
    day=map[new Date().getDay()]||"sun";
    if(!plan()) day=store.program[0].id;
    home=true;
    render();
    if(migWrote){ migWrote=false; save(); }
  },
  go(id){ home=false; day=id; confirmId=null; editing=false; openId=null; render();
    ROOT().scrollIntoView({block:"start"}); },
  home(){ home=true; editing=false; confirmId=null; openId=null; render();
    ROOT().scrollIntoView({block:"start"}); },
  isHome(){ return home; },
  jump(dayId,ei){ home=false; day=dayId; editing=false; confirmId=null; render(); API.history(ei); },
  toggleEdit(){ editing=!editing; confirmId=null; render(); ROOT().scrollIntoView({block:"start"}); },

  /* Open one exercise by hand. Tapping the open one again lets the day go back
     to following whichever exercise is next. */
  openOne(id){
    openId=(openId===id)?null:id;
    render();
    if(openId){
      const el=document.querySelector('#g4 section.ex.cur');
      if(el) el.scrollIntoView({block:"center",behavior:"smooth"});
    }
  },
  closeDay(){
    const g=dayGaps();
    if(g.hard.length||g.soft.length){
      closeAll();
      fsheet("Close the day","Everything has to carry a number first.","",gapBody());
      return;
    }
    const s=todaySess();
    const did=sessSets(s);
    s.closed=Date.now();
    if(!s.t1) s.t1=s.closed;
    openId=null;
    save(); render();
    closeAll();
    /* nothing was logged, so there is nothing to celebrate — just lock it */
    if(did) fsheet("Session complete",esc(plan().day)+" · "+esc(plan().label)+" · "+fmt(s.date),"",finishBody());
  },
  reopenDay(){ const s=todaySess(); delete s.closed; save(); render(); },
  gapGo(ei,si){
    const e=plan().ex[ei]; if(!e) return;
    closeAll();
    openId=e.id; render();
    const row=$("g4r-"+ei+"-"+si);
    if(row){
      row.scrollIntoView({block:"center"});
      const ins=row.querySelectorAll("input");
      const t=[].slice.call(ins).find(x=>!x.value)||ins[0];
      if(t) t.focus();
    }
  },
  skipEx(id){
    const s=todaySess();
    s.skip=Array.isArray(s.skip)?s.skip:[];
    const i=s.skip.indexOf(id);
    if(i>=0) s.skip.splice(i,1); else s.skip.push(id);
    if(!s.skip.length) delete s.skip;
    save(); render();
    const w=document.querySelector("#g4 .fsheet .fsbody");
    if(w) w.innerHTML=gapBody();
  },
  /* Writes the ladder the app already worked out into the empty rows. */
  fillNext(ei){
    const p=plan(), e=p.ex[ei];
    const pr=prevFor(e.id); if(!pr) return;
    const L=nextLadder(pr.sets,e.r,e.s,latOf(e,day));
    if(!L||!L.items||!L.items.length) return;
    const s=todaySess();
    const arr=s.ex[e.id]=s.ex[e.id]||[];
    for(let k=0;k<e.s;k++) arr[k]=arr[k]||["","",""];
    if(arr.some(filled)) return;
    L.items.forEach((x,i)=>{
      if(i>=e.s) return;
      while(arr[i].length<3) arr[i].push("");
      arr[i][0]=String(x.w); arr[i][1]=String(x.r);
    });
    stamp(s);
    /* stay on this exercise so he can edit what was just written; he moves on
       by tapping the next one himself */
    openId=e.id;
    GYM4.awake(); save(); render();
  },
  log(ei,si,f,val){
    const p=plan(), e=p.ex[ei], s=todaySess();
    const arr=s.ex[e.id]=s.ex[e.id]||[];
    for(let k=0;k<e.s;k++) arr[k]=arr[k]||["","",""];
    while(arr[si].length<3) arr[si].push("");
    arr[si][f]=val;
    if(!arr.some(x=>x[0]!==""||x[1]!=="")) delete s.ex[e.id];
    stamp(s);
    save();
    /* the same lookup logView draws the row from, so the arrow cannot disagree
       with the chips above it */
    const pr0=prevFor(e.id);
    const ps=pr0?pr0.sets:null;
    const row=$("g4r-"+ei+"-"+si);
    if(row){
      const ins=row.querySelectorAll("input");
      row.querySelector(".mark").setAttribute("data-state",
        mark([ins[0].value,ins[1].value,arr[si][2]||""], ps&&ps[si]?ps[si]:null));
      for(let k=0;k<ins.length;k++){
        const fld=ins[k].parentElement;
        if(fld) fld.classList.toggle("has",ins[k].value!=="");
      }
    }
    /* the three numbers up top are meant to move as he logs, not only when
       the page redraws */
    const lv=$("g4live");
    if(lv&&p) lv.innerHTML=liveBits(p,s);
    const done=p.ex.filter(x=>(s.ex[x.id]||[]).some(filled)).length;
    $("g4h2").textContent=fmt(iso())+" · "+done+" of "+p.ex.length+" exercises";
  },

  set(i,key,val){
    const e=plan().ex[i];
    if(key==="s") e.s=Math.max(1,Math.min(10,parseInt(val,10)||1));
    else if(key==="n") e.n=String(val).trim()||"Untitled";
    else if(key==="m") e.m=String(val);
    else if(key==="h") e.h=String(val).trim()||"general";
    else if(key==="step"){ const v=parseFloat(val); if(v>0) e.step=v; else delete e.step; }
    else if(key==="cap"){ const v=parseFloat(val); if(v>0) e.cap=v; else delete e.cap; }
    else e.r=String(val).trim()||"8-12";
    save(); render();
  },
  move(i,d){
    const ex=plan().ex, j=i+d;
    if(j<0||j>=ex.length) return;
    const t=ex[i]; ex[i]=ex[j]; ex[j]=t;
    save(); render();
  },

    const p=plan(), e=p.ex[i];

  plSet(key,val){

    if(key==="goal"){
      store.diet.goal=(val==="hold"||val==="gain")?val:"lose";
      /* the rates on offer differ between losing and gaining, so land on one
         that exists rather than leaving a dead selection */
      const RS=planRates();
      if(RS.indexOf(+store.diet.rate)<0) store.diet.rate=RS[RS.length-1];
      if(store.diet.goal==="hold") store.diet.rate=0;
    }
    else if(key==="rate") store.diet.rate=Math.max(0,parseFloat(val)||0);
    else if(key==="ppk"){
      const v=parseFloat(val);
      store.diet.ppk=(isFinite(v)&&v>=1&&v<=4)?v:2.2;
    }
    else if(key==="burn") store.diet.burn=Math.max(0,Math.round(parseFloat(val)||0));
    else if(key==="tgtkg"){
      const v=parseFloat(val);
      store.diet.tgtkg=(isFinite(v)&&v>0)?v:0;
    }
    else return;
    save(); render();

/* ---------- Arabic digits ----------
   The Arabic keyboard on his phone types ٠١٢ and iOS gives no way to make it
   type 012 unless the whole phone is switched to Arabic. A number box throws
   those characters away without a word - it simply reads back empty - so the
   boxes take text and the digits are folded here, in the capture phase, before
   any field's own handler reads the value. Folding covers Arabic-Indic and
   Persian digits and the Arabic decimal and thousands marks. Since the boxes
   are no longer type="number", anything that is not part of a number is also
   dropped, which a number box used to do for us: pasting "60 kg" leaves 60. */
(function(){
  const EL=document.getElementById("g4");
  if(!EL) return;
  const AR=/[\u0660-\u0669\u06F0-\u06F9\u066B\u066C\u060C\u06F0]/;
  function fold(v){
    return String(v)
      .replace(/[\u0660-\u0669]/g,d=>String.fromCharCode(d.charCodeAt(0)-0x0660+48))
      .replace(/[\u06F0-\u06F9]/g,d=>String.fromCharCode(d.charCodeAt(0)-0x06F0+48))
      .replace(/[\u066B\u060C]/g,".")
      .replace(/\u066C/g,"");
  }
  function clean(v,dec){
    let out=fold(v).replace(dec?/[^0-9.\-]/g:/[^0-9\-]/g,"");
    /* one dot, one leading minus */
    const neg=out.charAt(0)==="-";
    out=out.replace(/-/g,"");
    const i=out.indexOf(".");
    if(i>=0) out=out.slice(0,i+1)+out.slice(i+1).replace(/\./g,"");
    return (neg?"-":"")+out;
  }
  function tidy(ev){
    const el=ev.target;
    if(!el||el.tagName!=="INPUT") return;
    const im=(el.getAttribute("inputmode")||"").toLowerCase();
    if(im!=="decimal"&&im!=="numeric") return;
    const v=el.value;
    if(v==="") return;
    const n=clean(v,im==="decimal");
    if(n===v) return;
    /* keep the caret where he left it, allowing for characters dropped */
    let p=el.selectionStart;
    if(typeof p==="number") p=Math.max(0,p-(v.length-n.length));
    el.value=n;
    try{ el.setSelectionRange(p,p); }catch(e){}
  }
  EL.addEventListener("input",tidy,true);
  EL.addEventListener("change",tidy,true);
  /* the sign-in box lives outside #g4 and takes no numbers, so it is left alone */
})();

/* ---------- drag sideways to come back ----------
   Listens anywhere on the page rather than at the screen edge: in plain Safari
   an edge drag is the browser's own back gesture and would leave the app. The
   gesture is ignored on the home screen, inside a number box, and on anything
   that scrolls sideways itself. Either direction works. */
(function(){
  const EL=document.getElementById("g4");
  if(!EL) return;
  let x0=0, y0=0, t0=0, live=false;

  function scrollsSideways(n){
    while(n&&n!==EL){
      if(n.scrollWidth>n.clientWidth+4){
        const o=getComputedStyle(n).overflowX;
        if(o==="auto"||o==="scroll") return true;
      }
      n=n.parentElement;
    }
    return false;
  }
  function blocked(n){
    if(!n||!n.closest) return true;
    if(n.closest("input,textarea,select,button,a,[contenteditable]")) return true;
    return scrollsSideways(n);
  }

  EL.addEventListener("touchstart",function(e){
    live=false;
    if(e.touches.length!==1) return;
    if(blocked(e.target)) return;
    const t=e.touches[0];
    x0=t.clientX; y0=t.clientY; t0=Date.now(); live=true;
  },{passive:true});

  EL.addEventListener("touchend",function(e){
    if(!live) return;
    live=false;
    const t=e.changedTouches&&e.changedTouches[0];
    if(!t) return;
    const dx=t.clientX-x0, dy=t.clientY-y0, ms=Date.now()-t0;
    /* a real sideways flick: far enough, clearly horizontal, and not a slow drag */
    if(Math.abs(dx)<70) return;
    if(Math.abs(dx)<Math.abs(dy)*1.6) return;
    if(ms>800) return;
    back();
  },{passive:true});

  EL.addEventListener("touchcancel",function(){ live=false; },{passive:true});

  /* a panel on top of the day closes first, the day itself comes second */
  function back(){
    if(document.querySelector("#g4 .sheet, #g4 .fsheet")){
      if(window.GYM4&&GYM4.closeSheet) closeAll();
      else document.querySelectorAll("#g4 .sheet, #g4 .fsheet").forEach(s=>s.remove());
      return;
    }
    if(window.GYM4&&GYM4.isHome&&GYM4.isHome()) return;
    if(window.GYM4&&GYM4.home) GYM4.home();
  }
})();

function showLogin(){ $("lg").hidden=false; $("lgLoad").hidden=true; $("lgFields").hidden=false; }
async function start(){
  if(started) return; started=true; Store.cloud=true; $("lg").hidden=true;
  await API.init();
  const raw=JSON.stringify(store);
  window.FB.write(raw,store.ts||Date.now()).catch(function(){});
  setTimeout(function(){ dailySnap(); },1500);
}
window.addEventListener("fbauth",function(e){
  if(e.detail) start();
  else { if(started){ location.reload(); return; } showLogin(); }
});
if(window.FB&&("user" in window.FB)){ if(window.FB.user) start(); else showLogin(); }
setTimeout(function(){ if(!started&&!window.FB) showLogin(); },8000);
$("lgForm").addEventListener("submit",async function(e){
  e.preventDefault();
  const er=$("lgErr"), btn=$("lgBtn"), em=$("lgEmail").value.trim(), pw=$("lgPass").value; er.hidden=true;
  if(!em||!pw){ er.textContent="Enter your email and password."; er.hidden=false; return; }
  if(!window.FB){ er.textContent="No internet. Check your connection."; er.hidden=false; return; }
  btn.disabled=true; btn.textContent="Signing in…";
  try{ await window.FB.signIn(em,pw); $("lgPass").value=""; }
  catch(x){ const c=x&&x.code||""; er.textContent=c.indexOf("too-many")>=0?"Too many tries. Wait a few minutes.":c.indexOf("network")>=0?"No internet. Check your connection.":"Wrong email or password."; er.hidden=false; }
  btn.disabled=false; btn.textContent="Sign in";
});
return API;
})();
</script>
</body>
</html>
