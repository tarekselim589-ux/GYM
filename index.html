/* ---------- what you see the moment the day closes ---------- */
function finishBody(){
  const p=plan(), s=todaySess();
  const vol=sessVol(s), prs=sessPRs(s), mins=sessMins(s);
  const pv=prevReal(), pvol=pv?sessVol(pv):0;
  const sets=sessSets(s), reps=sessReps(s);
  const pct=pvol>0?Math.round((vol-pvol)/pvol*100):null;
  const r=58, C=2*Math.PI*r;
  const fillPct=pvol>0?Math.max(.08,Math.min(1,vol/Math.max(vol,pvol))):1;
  const ring='<div class="ring"><svg width="136" height="136" viewBox="0 0 136 136" aria-hidden="true">'+
    '<circle cx="68" cy="68" r="'+r+'" fill="none" stroke="#3A6880" stroke-width="11"/>'+
    '<circle cx="68" cy="68" r="'+r+'" fill="none" stroke="#4CDCD6" stroke-width="11" stroke-linecap="round"'+
      ' stroke-dasharray="'+C.toFixed(1)+'" stroke-dashoffset="'+(C*(1-fillPct)).toFixed(1)+'"'+
      ' transform="rotate(-90 68 68)"/></svg>'+
    '<div class="rl"><div><b>'+vol.toLocaleString()+'</b><i>kg lifted</i></div></div></div>';

  let vs="";
  if(pvol>0){
    const d=vol-pvol;
    const near=Math.abs(pct)<1;
    const big=near?(d>=0?"+":"−")+Math.abs(d).toLocaleString()+"<s>kg</s>"
                 :(pct>=0?"+":"")+pct+"%";
    vs='<div class="vs"><div class="big'+(near?' lvl':'')+'">'+big+'</div>'+
      '<div class="tx">'+(near?"Level with last ":d>0?"Heavier than last ":"Lighter than last ")+esc(p.day)+
      ' — <b>'+vol.toLocaleString()+' kg</b> against '+pvol.toLocaleString()+' kg.</div></div>';
  }

  const cell=(v,l,d)=>'<div class="cell"><div class="v">'+v+'</div><div class="l">'+l+'</div>'+
    (d?'<div class="d">'+d+'</div>':'')+'</div>';
  const grid='<div class="grid">'+
    cell(mins?mins+'<s> min</s>':'—',"Session","")+
    cell(sets,"Sets",pv?sessSets(pv)+" last time":"")+
    cell(reps,"Reps",pv?sessReps(pv)+" last time":"")+
    cell(sets?(reps/sets).toFixed(1):"0","Reps / set",
      pv&&sessSets(pv)?"was "+(sessReps(pv)/sessSets(pv)).toFixed(1):"")+
    '</div>';

  let pr="";
  if(prs.length) pr='<h3 class="qh">New records</h3>'+prs.map(x=>
    '<div class="prc"><span class="m">★</span><span class="n">'+esc(x.n)+'</span>'+
    '<span class="r">'+esc(x.w)+' kg × '+esc(x.r)+'</span></div>').join("");

  const rows=p.ex.map(e=>{
    if(isSkipped(s,e)||!exTouched(s,e))
      return '<div class="rowq sk"><span class="nm">'+esc(e.n)+'</span><span class="rs">skipped</span></div>';
    const a=(s.ex[e.id]||[]).filter(filled);
    if(!a.length) return "";
    const w=a[0][0], same=a.every(x=>x[0]===w);
    const res=same?'<b>'+esc(w)+'</b>kg × '+a.map(x=>esc(x[1])).join(",")
                  :a.map(x=>'<b>'+esc(x[0])+'</b>×'+esc(x[1])).join(" · ");
    return '<div class="rowq"><span class="nm">'+esc(e.n)+'</span><span class="rs">'+res+'</span></div>';
  }).join("");

  return '<div class="fin">'+ring+vs+grid+pr+
    '<h3 class="qh">Everything you logged</h3>'+rows+
    '<button class="finbtn" onclick="GYM4.closeSheet(this)">Back to the day</button></div>';
}

/* ---------- the panel that says what is still missing ---------- */
function gapBody(){
  const g=dayGaps(), s=todaySess();
  let h="";
  if(g.hard.length){
    h+='<div class="sheetc"><div class="sh"><div class="ttl">'+
      (g.hard.length===1?"One set is still empty":g.hard.length+" sets are still empty")+'</div>'+
      '<div class="s">The day cannot close while a number is missing. Tap a line to go straight to it.</div></div>'+
      g.hard.map(x=>'<div class="gapr"><span class="ic">!</span><div class="tx"><b>'+esc(x.n)+'</b>'+
        '<i>Set '+(x.si+1)+' — '+esc(x.why)+'</i></div>'+
        '<button class="go" onclick="GYM4.gapGo('+x.ei+','+x.si+')">Go</button></div>').join("")+
      '</div>';
  }
  if(g.soft.length){
    h+='<div class="sheetc skip"><div class="sh"><div class="ttl">'+
      (g.soft.length===1?"One exercise you never started":g.soft.length+" exercises you never started")+'</div>'+
      '<div class="s">If you did not do them today, mark them skipped and the day can close.</div></div>'+
      g.soft.map(x=>'<div class="gapr"><span class="ic">'+(x.ei+1)+'</span>'+
        '<div class="tx"><b>'+esc(x.n)+'</b><i>Nothing logged</i></div>'+
        '<button class="sw" role="switch" aria-checked="false" aria-label="Skip '+esc(x.n)+'"'+
        ' onclick="GYM4.skipEx(\''+x.id+'\')"></button></div>').join("")+
      '</div>';
  }
  const skipped=(plan().ex||[]).filter(e=>isSkipped(s,e));
  if(skipped.length){
    h+='<div class="sheetc skip"><div class="sh"><div class="ttl">Marked skipped</div>'+
      '<div class="s">Tap to put one back.</div></div>'+
      skipped.map(e=>'<div class="gapr"><span class="ic">—</span>'+
        '<div class="tx"><b>'+esc(e.n)+'</b><i>Will be logged as skipped</i></div>'+
        '<button class="sw on" role="switch" aria-checked="true" aria-label="Unskip '+esc(e.n)+'"'+
        ' onclick="GYM4.skipEx(\''+e.id+'\')"></button></div>').join("")+
      '</div>';
  }
  const n=g.hard.length+g.soft.length;
  h+='<div class="closebar"><button class="closebtn'+(n?'':' ready')+'" onclick="GYM4.closeDay()">'+
    'Close the day'+(n?' · '+n+' left':'')+'</button>'+
    '<div class="closenote">'+(n?'Fill what is above, or mark it skipped':'All clear — tap to close')+
    '</div></div>';
  return h;
}

let migWrote=false;
function normalize(){
  if(!store.program||!store.program.length) store.program=seed();
  store.program.forEach(p=>{ if(!Array.isArray(p.bench)) p.bench=[]; });
  /* days taken out of the program wait here with their exercises; a day can
     only live in one of the two places */
  if(!Array.isArray(store.archive)) store.archive=[];
  store.archive=store.archive.filter(a=>a&&a.id&&!store.program.some(p=>p.id===a.id));
  store.archive.forEach(p=>{ if(!Array.isArray(p.ex)) p.ex=[]; if(!Array.isArray(p.bench)) p.bench=[]; });
  /* superset marks that point nowhere (last exercise, chains, the bench) go */
  store.program.forEach(p=>{ if(Array.isArray(p.ex)) ssClean(p); });
  store.archive.forEach(ssClean);
  /* days1: every day carries its own weekday (0 = Sunday) instead of the old
     fixed sun/tue/wed/fri table. Fills only what is missing, so a day he has
     moved stays where he put it. */
  store.mig=store.mig||{};
  {
    let filled=0;
    store.program.concat(store.archive).forEach(p=>{
      if(p.wd===undefined){ p.wd=WD0[p.id]!==undefined?WD0[p.id]:null; filled++; }
    });
    if(!store.mig.days1){ store.mig.days1=1; migWrote=true; }
    else if(filled) migWrote=true;
  }
  if(!store.days) store.days={};
  if(!store.weights) store.weights=[];
  if(!store.measures) store.measures=[];
  /* one-off: the tick-a-meal list is replaced by a weighed food log. Runs once,
     so a list the user has since edited is never rebuilt. */
  store.mig=store.mig||{};
  if(!store.mig.food1){ delete store.meals; delete store.food; store.mig.food1=1; }
  if(!store.lib||!store.lib.length) store.lib=seedLib();
  if(!store.diet) store.diet=seedDiet();
  /* one-off: the day used to turn over at midnight. It is closed by hand now, so
     move each stored date into the closed list and keep today's as the open one. */
  if(!store.mig.food2){
    store.eatLog=Array.isArray(store.eatLog)?store.eatLog:[];
    if(store.eat&&typeof store.eat==="object"){
      Object.keys(store.eat).sort().forEach(d=>{
        const rows=store.eat[d];
        if(!Array.isArray(rows)||!rows.length) return;
        if(d===iso()) store.eatNow={start:Date.now(),rows:rows};
        else store.eatLog.push({d:d,start:0,end:0,rows:rows});
      });
    }
    delete store.eat;
    store.mig.food2=1;
  }
  /* one-off: the list labels are in English now; the food names stay as they are */
  if(!store.mig.food3){
    const MAP={"\u0628\u0631\u0648\u062a\u064a\u0646":"Protein","\u0646\u0634\u0648\u064a\u0627\u062a":"Carbs","\u0623\u0644\u0628\u0627\u0646":"Dairy",
      "\u0641\u0627\u0643\u0647\u0629 \u0648\u062e\u0636\u0627\u0631":"Fruit & veg","\u0645\u0643\u0633\u0631\u0627\u062a \u0648\u062f\u0647\u0648\u0646":"Nuts & fats","\u062a\u0627\u0646\u064a":"Other"};
    (store.lib||[]).forEach(x=>{ if(x&&MAP[x.c]) x.c=MAP[x.c]; });
    store.mig.food3=1;
  }
  /* one-off: both powders were entered from memory before the tubs were read.
     The protein scoop is now his weighed 37 g off a 90.7% label. */
  if(!store.mig.food4){
    const FIX={"\u0633\u0643\u0648\u0628 \u0628\u0631\u0648\u062a\u064a\u0646":[137,33.6,0.1,0.6],"\u0633\u0643\u0648\u0628 \u0645\u0627\u0643\u0631\u0648 \u0643\u0627\u0631\u0628":[174,0,0,43.2]};
    (store.lib||[]).forEach(x=>{
      const v=x&&FIX[x.n];
      if(v){ x.k=v[0]; x.p=v[1]; x.f=v[2]; x.b=v[3]; }
    });
    store.mig.food4=1;
  }
  /* one-off: the grilled plate, added after the fact, for a list already seeded */
  if(!store.mig.food5){
    const ADD=[["\u0643\u0641\u062a\u0629 \u0644\u062d\u0645\u0629 \u2014 \u0635\u0628\u0627\u0639",186,14,13,2],["\u0643\u0641\u062a\u0629 \u0641\u0631\u0627\u062e \u2014 \u0635\u0628\u0627\u0639",147,15,9,2],
               ["\u0634\u064a\u0634 \u0637\u0627\u0648\u0648\u0642 \u2014 \u0633\u064a\u062e",209,32,8,2],["\u0633\u064a\u062e \u0644\u062d\u0645\u0629",253,31,13,0]];
    store.lib=store.lib||[];
    ADD.forEach(a=>{
      if(store.lib.some(x=>x&&x.n===a[0])) return;
      store.lib.push({id:uid(),c:"Protein",n:a[0],u:"pc",k:a[1],p:a[2],f:a[3],b:a[4]});
    });
    store.mig.food5=1;
  }
  /* one-off: switch carb cycling on at 50 g. It runs once, so turning it off
     later in Edit stays off. */
  if(!store.mig.food6){
    store.diet=Object.assign(seedDiet(),store.diet||{});
    if(!(+store.diet.shift>0)) store.diet.shift=50;
    store.mig.food6=1;
  }
  /* Everything added by hand landed in Other, so the ones already there get put
     where they belong and the breaded chicken breast he air-fries is added. Only
     items still sitting in Other are touched, so a category he has since set by
     hand is never overwritten. Anything in Other this does not recognise stays
     there - a wrong guess would just hide the food somewhere he is not looking. */
  if(!store.mig.food7){
    store.lib=store.lib||[];
    const MOVE=[["عسل","Carbs"],["معمول","Snacks"]];
    store.lib.forEach(x=>{
      if(!x||(x.c&&x.c!=="Other")) return;
      const n=String(x.n||"");
      for(let i=0;i<MOVE.length;i++) if(n.indexOf(MOVE[i][0])===0){ x.c=MOVE[i][1]; return; }
    });
    const PAN="بانيه";
    if(!store.lib.some(x=>x&&String(x.n||"").indexOf(PAN)>=0))
      store.lib.push({id:uid(),c:"Protein",n:PAN,u:"g",k:220,p:27,f:6,b:11});
    store.mig.food7=1;
    migWrote=true;
  }
  /* His list has \u0628\u0637\u0627\u0637\u0633 but not the sweet one. One entry for both
     boiled and roasted - the 14 kcal between them per 100 g is not worth two
     rows he has to pick between. */
  if(!store.mig.food8){
    store.lib=store.lib||[];
    const SP="\u0628\u0637\u0627\u0637\u0627";
    if(!store.lib.some(x=>x&&String(x.n||"").indexOf(SP)===0))
      store.lib.push({id:uid(),c:"Carbs",
        n:"\u0628\u0637\u0627\u0637\u0627 \u0645\u0633\u0644\u0648\u0642\u0629 \u0623\u0648 \u0645\u0634\u0648\u064a\u0629",
        u:"g",k:86,p:1.7,f:0.1,b:20});
    store.mig.food8=1;
    migWrote=true;
  }
  /* The empty rows left behind by the old behaviour. Anything holding a number,
     even half of one, stays — so a weight with no reps is kept, not tidied away. */
  if(!store.mig.sess1){
    let dropped=0;
    Object.keys(store.days||{}).forEach(id=>{
      const d=store.days[id]; if(!d||!Array.isArray(d.sessions)) return;
      const n=d.sessions.length;
      d.sessions=d.sessions.filter(x=>sessAny(x));
      dropped+=n-d.sessions.length;
    });
    store.mig.sess1=1;
    /* persist straight away, or closing the app would leave the rows behind
       and the sweep would have to run all over again */
    if(dropped) migWrote=true;
  }
  if(!Array.isArray(store.eatLog)) store.eatLog=[];
  /* One-off: days closed after midnight were stamped with the previous day, so
     some dates hold two days of food and the day between them holds none. A
     record whose first row reads earlier on the clock than its own start began
     the following morning, so it moves there - but only onto a free date, since
     guessing a date that is already taken would be worse than leaving it. */
  if(!store.mig.eat1){
    /* Older days were stamped with the time they were CLOSED, which for a day
       closed after midnight is the day after. Put each one back on the day it
       started, oldest first, so the chain unwinds and frees the date the next
       one wants. Only onto a free date - never over a day that already exists. */
    store.eatLog.sort((a,b)=>((a&&a.start)||0)-((b&&b.start)||0));
    store.eatLog.forEach(x=>{
      if(!x||!x.start||!x.d) return;
      const want=iso(new Date(x.start));
      if(want===x.d) return;
      if(store.eatLog.some(y=>y!==x&&y&&y.d===want)) return;
      x.d=want;
    });
    store.eatLog.sort((a,b)=>a.d<b.d?-1:1);
    const by={};
    store.eatLog.forEach(x=>{ if(x&&x.d) (by[x.d]=by[x.d]||[]).push(x); });
    const taken=d=>store.eatLog.some(x=>x&&x.d===d);
    const hm=t=>{ const p=String(t||"").split(":");
      return p.length===2?(+p[0]*60+ +p[1]):-1; };
    let moved=0, stuck=0;
    Object.keys(by).forEach(day=>{
      const list=by[day];
      if(list.length<2) return;
      /* the first record closed on that date keeps it */
      for(let i=1;i<list.length;i++){
        const r=list[i], rows=r.rows||[];
        const st=r.start?new Date(r.start):null;
        if(!st||!rows.length){ stuck++; continue; }
        const first=hm(rows[0].t), startMin=st.getHours()*60+st.getMinutes();
        if(first<0||first>=startMin){ stuck++; continue; }
        const nd=iso(new Date(st.getTime()+864e5));
        if(taken(nd)){ stuck++; continue; }
        r.d=nd; r.start=st.getTime()+864e5; moved++;
      }
    });
    if(moved) store.eatLog.sort((a,b)=>a.d<b.d?-1:1);
    store.mig.eat1=1;
    store.migEat={moved:moved,stuck:stuck};
    if(moved||stuck) migWrote=true;
  }
  if(!Array.isArray(store.combo)) store.combo=[];
  if(!Array.isArray(store.pins)) store.pins=[];
  if(!store.eatNow||!Array.isArray(store.eatNow.rows)) store.eatNow={start:0,rows:[]};
  // keep the closed list small: the last 60 days
  while(store.eatLog.length>60) store.eatLog.shift();
  const ref={};
  seed().forEach(p=>p.ex.forEach(e=>{ ref[e.n]={m:e.m,h:e.h}; }));
  store.program.forEach(p=>p.ex.forEach(e=>{
    if(!e.m){ const r=ref[e.n]; e.m=r?r.m:"other"; e.h=r?r.h:"general"; }
  }));
  /* one-off: direct arm volume was the thinnest part of the program.
     Runs once, skips anything already there, and never comes back if deleted. */
  store.mig=store.mig||{};
  if(!store.mig.arm1){
    const addEx=(dayId,name,sets,reps,rest,why,m,h)=>{
      const d=store.program.find(p=>p.id===dayId); if(!d||!d.ex) return;
      const nm=name.toLowerCase().replace(/\s+/g," ").trim();
      if(d.ex.some(e=>(e.n||"").toLowerCase().replace(/\s+/g," ").trim()===nm)) return;
      let i=1; while(d.ex.some(e=>e.id===dayId+"-m"+i)) i++;
      d.ex.push({id:dayId+"-m"+i,n:name,s:sets,r:reps,rest:rest,why:why,m:m,h:h});
    };
    addEx("wed","Hammer Curl",3,"10-12",60,"Brachialis, pushes the biceps up","biceps","mid");
    addEx("sun","Overhead Rope Extension",3,"10-12",60,"Triceps long head, in stretch","triceps","long");
    store.mig.arm1=1;
  }
  /* one-off: exercise order. The lagging work was always landing last, when
     there is nothing left to give it. Renames keep the exercise id, so the
     logged history stays attached. Skips anything already moved or deleted. */
  if(!store.mig.order1){
    const K=s=>(s||"").toLowerCase().replace(/\s+/g," ").trim();
    const find=(dayId,name)=>{
      const d=store.program.find(p=>p.id===dayId);
      if(!d||!d.ex) return null;
      return d.ex.find(x=>K(x.n)===K(name))||null;
    };
    const rename=(dayId,from,to,why)=>{ const e=find(dayId,from); if(e){ e.n=to; if(why) e.why=why; } };
    const note=(dayId,name,why)=>{ const e=find(dayId,name); if(e) e.why=why; };
    const add=(dayId,name,sets,reps,rest,why,m,h)=>{
      const d=store.program.find(p=>p.id===dayId); if(!d||!d.ex) return;
      if(d.ex.some(x=>K(x.n)===K(name))) return;
      let i=1; while(d.ex.some(x=>x.id===dayId+"-o"+i)) i++;
      d.ex.push({id:dayId+"-o"+i,n:name,s:sets,r:reps,rest:rest,why:why,m:m,h:h});
    };
    const order=(dayId,names)=>{
      const d=store.program.find(p=>p.id===dayId); if(!d||!d.ex) return;
      const want=names.map(K);
      d.ex=d.ex.map((e,i)=>({e:e,i:i})).sort((a,b)=>{
        const ra=want.indexOf(K(a.e.n)), rb=want.indexOf(K(b.e.n));
        const xa=ra<0?999:ra, xb=rb<0?999:rb;
        return xa!==xb?xa-xb:a.i-b.i;   /* anything unknown keeps its place at the end */
      }).map(x=>x.e);
    };

    add("sun","Preacher Curl",3,"10-12",60,"Short head - arm in front of the body","biceps","short");

    rename("wed","Wide Lat Pulldown","Neutral Grip Lat Pulldown",
           "Neutral close (V-handle) - lower lats, not a repeat of #1");
    note("wed","Wide Grip Pull-up / Lat Pulldown","Overhand, wide - back width");
    note("wed","Chest-Supported Row","Overhand, shoulder width - back thickness");
    note("wed","Cable Curl","Underhand, shoulder width - biceps");
    note("wed","Straight-Arm Pulldown","Overhand, arms locked straight - lats only");
    note("wed","Hammer Curl","Neutral grip - brachialis under the biceps");
    note("wed","Cable Face Pull","Rope, overhand - rear delt and shoulder health");
    note("fri","Shrugs","Traps - last, it burns your grip");

    order("sun",["Flat Chest Press (Smith)","Incline Chest Press","Preacher Curl","Shoulder Press",
                 "Overhead Rope Extension","Cable / Machine Fly","DB Side Lateral","Triceps Cable Pushdown"]);
    order("tue",["Narrow Hack Squat","Romanian Deadlift","Leg Extension","Leg Curl",
                 "hip adduction","Calf Raise","Abdominal Machine"]);
    order("wed",["Wide Grip Pull-up / Lat Pulldown","Chest-Supported Row","Neutral Grip Lat Pulldown",
                 "Cable Curl","Straight-Arm Pulldown","Hammer Curl","Cable Face Pull"]);
    order("fri",["Incline Press (DB)","Close Grip Cable Row","Incline DB Curl","Dips (Machine)",
                 "Overhead Cable Triceps","DB Side Laterals","Rear Delt Fly","One-Arm Cable Pushdown","Shrugs"]);
    store.mig.order1=1;
  }
  /* One sweep to 8-13. A narrow range leaves the ladder nowhere to go on a stack
     whose plates are 4.5 or 6.8 kg apart: it can only shave reps off the pin he
     is already on, so the suggestion walks backwards - 27x13 last week becomes
     27x10 this week - while the weight never moves. A wider range lets it trade
     reps for the next pin up, and 32x8 appears on its own.
     Side and rear delts, calves and abs keep the reps they have: a small muscle
     under a heavy low-rep load loses its form before it gains anything. */
  if(!store.mig.reps1){
    const keepReps=e=>{
      const m=String(e.m||"").toLowerCase(), h=String(e.h||"").toLowerCase();
      return m==="abs"||m==="calves"||(m==="delts"&&(h==="side"||h==="rear"));
    };
    let n=0;
    (store.program||[]).forEach(p=>{
      (p.ex||[]).concat(p.bench||[]).forEach(e=>{
        if(e&&!keepReps(e)&&e.r!=="8-13"){ e.r="8-13"; n++; }
      });
    });
    store.mig.reps1=1;
    if(n) migWrote=true;
  }
  /* One-off: before the 5am day, a workout that ran past midnight was cut in two -
     the sets after 12 opened a new session on the next date. A session whose first
     set was typed between midnight and 5am on its own date goes back to the day
     before, merged into that day's session if there is one. Any set slot holding
     something in both is left alone, the whole pair untouched: no number is lost. */
  if(!store.mig.split1){
    const used=v=>!!v&&(half(v[0])||half(v[1])||half(v[2]));
    const dayBefore=d=>{ const x=new Date(d+"T12:00:00"); x.setDate(x.getDate()-1); return iso(x); };
    let n=0;
    Object.keys(store.days||{}).forEach(id=>{
      const ss=(store.days[id]||{}).sessions;
      if(!Array.isArray(ss)) return;
      for(let i=ss.length-1;i>=0;i--){
        const x=ss[i];
        if(!x||!x.t0||!x.date) continue;
        const t=new Date(x.t0);
        if(t.getHours()>=GYMH||iso(t)!==x.date) continue;
        const d=dayBefore(x.date);
        const y=ss.find(s=>s&&s!==x&&s.date===d);
        if(!y){ x.date=d; n++; continue; }
        const xe=x.ex||{}, ye=y.ex=y.ex||{};
        const clash=Object.keys(xe).some(k=>(xe[k]||[]).some((v,j)=>used(v)&&ye[k]&&used(ye[k][j])));
        if(clash) continue;
        Object.keys(xe).forEach(k=>{
          const a=xe[k]||[];
          if(!ye[k]){ ye[k]=a; return; }
          const b=ye[k];
          a.forEach((v,j)=>{
            while(b.length<=j) b.push(["","",""]);
            if(used(v)) b[j]=v;
          });
        });
        if(Array.isArray(x.skip)){
          y.skip=Array.isArray(y.skip)?y.skip:[];
          x.skip.forEach(k=>{ if(y.skip.indexOf(k)<0) y.skip.push(k); });
        }
        if(x.closed) y.closed=Math.max(y.closed||0,x.closed);
        if(x.t0&&(!y.t0||x.t0<y.t0)) y.t0=x.t0;
        if(x.t1&&(!y.t1||x.t1>y.t1)) y.t1=x.t1;
        ss.splice(i,1);
        n++;
      }
    });
    store.mig.split1=1;
    if(n) migWrote=true;
  }
  /* One-off, after split1: where the update landed mid-workout he typed the
     after-midnight sets a second time into the day before, so split1 found the
     same slots used in both and rightly left the pair alone. The after-midnight
     session goes only when it is a pure copy - every slot it uses holds the very
     same numbers in the same slot the day before. One differing value and it
     stays, to be decided by hand. */
  if(!store.mig.split2){
    const used=v=>!!v&&(half(v[0])||half(v[1])||half(v[2]));
    const norm=a=>{ const s=String(a==null?"":a).trim(), n=Number(s); return s!==""&&isFinite(n)?String(n):s; };
    const same=(a,b)=>!!a&&!!b&&[0,1,2].every(k=>norm(a[k])===norm(b[k]));
    const dayBefore=d=>{ const x=new Date(d+"T12:00:00"); x.setDate(x.getDate()-1); return iso(x); };
    let n=0;
    Object.keys(store.days||{}).forEach(id=>{
      const ss=(store.days[id]||{}).sessions;
      if(!Array.isArray(ss)) return;
      for(let i=ss.length-1;i>=0;i--){
        const x=ss[i];
        if(!x||!x.t0||!x.date) continue;
        const t=new Date(x.t0);
        if(t.getHours()>=GYMH||iso(t)!==x.date) continue;
        const y=ss.find(s=>s&&s!==x&&s.date===dayBefore(x.date));
        if(!y||!y.ex) continue;
        const xe=x.ex||{};
        let any=false, copy=true;
        Object.keys(xe).forEach(k=>(xe[k]||[]).forEach((v,j)=>{
          if(!used(v)) return;
          any=true;
          if(!(y.ex[k]&&same(v,y.ex[k][j]))) copy=false;
        }));
        if(!any||!copy) continue;
        ss.splice(i,1);
        n++;
      }
    });
    store.mig.split2=1;
    if(n) migWrote=true;
  }
}

/* Merge a backup into what is already here: add what is missing, never
   overwrite and never delete. Returns counts of what was added. */
function mergeIn(d){
  const n={ex:0,sessions:0,sets:0,weights:0,measures:0,lib:0,eat:0,days:0};
  const clone=x=>JSON.parse(JSON.stringify(x));

  if(Array.isArray(d.program)){
    store.program=store.program||[];
    d.program.forEach(ip=>{
      if(!ip||!ip.id) return;
      /* a day he took out stays out: its exercises merge into the archived copy */
      let cp=store.program.find(x=>x.id===ip.id)||
             (Array.isArray(store.archive)?store.archive:[]).find(x=>x.id===ip.id);
      if(!cp){ store.program.push(clone(ip)); n.days++; n.ex+=(ip.ex||[]).length; return; }
      cp.ex=cp.ex||[];
      (ip.ex||[]).forEach(ie=>{
        /* added at the end of the day, so a superset mark would link it to a stranger */
        if(ie&&ie.id&&!cp.ex.some(e=>e.id===ie.id)){ const c=clone(ie); delete c.ss; cp.ex.push(c); n.ex++; }
      });
      /* a benched exercise still owns its history, so it has to come across too */
      if(Array.isArray(ip.bench)){
        cp.bench=Array.isArray(cp.bench)?cp.bench:[];
        ip.bench.forEach(ie=>{
          if(!ie||!ie.id) return;
          if(cp.ex.some(e=>e.id===ie.id)||cp.bench.some(e=>e.id===ie.id)) return;
          cp.bench.push(clone(ie)); n.ex++;
        });
      }
    });
  }

  /* days the backup had taken out: add the ones missing here, never pull one
     back into the program, and fill in exercises a known day is missing */
  if(Array.isArray(d.archive)){
    store.archive=Array.isArray(store.archive)?store.archive:[];
    d.archive.forEach(ip=>{
      if(!ip||!ip.id) return;
      const cp=store.program.find(x=>x.id===ip.id)||store.archive.find(x=>x.id===ip.id);
      if(!cp){ store.archive.push(clone(ip)); n.days++; n.ex+=(ip.ex||[]).length; return; }
      cp.ex=cp.ex||[]; cp.bench=Array.isArray(cp.bench)?cp.bench:[];
      (ip.ex||[]).concat(ip.bench||[]).forEach(ie=>{
        if(!ie||!ie.id) return;
        if(cp.ex.some(e=>e.id===ie.id)||cp.bench.some(e=>e.id===ie.id)) return;
        cp.bench.push(clone(ie)); n.ex++;
      });
    });
  }

  if(Array.isArray(d.pins)&&!pinsOf().length&&d.pins.length){
    store.pins=clone(d.pins);
  }
  if(Array.isArray(d.combo)){
    store.combo=Array.isArray(store.combo)?store.combo:[];
    d.combo.forEach(c=>{
      if(!c||!c.id||!Array.isArray(c.rows)||!c.rows.length) return;
      if(store.combo.some(x=>x.id===c.id)) return;
      store.combo.push(clone(c)); n.lib++;
    });
  }
  if(Array.isArray(d.lib)){
    store.lib=store.lib||[];
    d.lib.forEach(im=>{
      if(im&&im.id&&!store.lib.some(m=>m.id===im.id)){ store.lib.push(clone(im)); n.lib++; }
    });
  }
  if(d.diet&&typeof d.diet==="object"&&!store.diet) store.diet=clone(d.diet);

  if(d.days&&typeof d.days==="object"){
    store.days=store.days||{};
    Object.keys(d.days).forEach(k=>{
      const inc=((((d.days[k]||{}).sessions)||[])).filter(x=>x&&x.date);
      if(!inc.length) return;                       // nothing usable: do not create the day
      const dst=store.days[k]=store.days[k]||{sessions:[]};
      dst.sessions=dst.sessions||[];
      inc.forEach(is=>{
        const cs=dst.sessions.find(x=>x.date===is.date);
        if(!cs){ dst.sessions.push(clone(is)); n.sessions++; n.sets+=Object.keys(is.ex||{}).length; return; }
        cs.ex=cs.ex||{};
        Object.keys(is.ex||{}).forEach(id=>{
          if(!(id in cs.ex)){ cs.ex[id]=clone(is.ex[id]); n.sets++; }
        });
      });
      dst.sessions.sort((a,b)=>a.date<b.date?-1:1);
    });
  }

  if(Array.isArray(d.weights)){
    store.weights=store.weights||[];
    d.weights.forEach(w=>{
      if(w&&w.d&&isFinite(+w.v)&&!store.weights.some(x=>x.d===w.d)){
        store.weights.push({d:w.d,v:+w.v}); n.weights++;
      }
    });
    store.weights.sort((a,b)=>a.d<b.d?-1:1);
  }

  if(!store.height&&d.height) store.height=d.height;
  if(Array.isArray(d.measures)){
    store.measures=store.measures||[];
    d.measures.forEach(m=>{
      if(m&&m.d&&!store.measures.some(x=>x.d===m.d)){ store.measures.push(clone(m)); n.measures++; }
    });
    store.measures.sort((a,b)=>a.d<b.d?-1:1);
  }

  if(Array.isArray(d.eatLog)){
    store.eatLog=Array.isArray(store.eatLog)?store.eatLog:[];
    d.eatLog.forEach(x=>{
      if(!x||!x.d||!Array.isArray(x.rows)||!x.rows.length) return;
      // a day already closed here is never added twice
      if(store.eatLog.some(y=>y.d===x.d)) return;
      store.eatLog.push(clone(x)); n.eat+=x.rows.length;
    });
    store.eatLog.sort((a,b)=>a.d<b.d?-1:1);
  }
  /* an older backup may still hold the date-keyed shape */
  if(d.eat&&typeof d.eat==="object"){
    store.eatLog=Array.isArray(store.eatLog)?store.eatLog:[];
    Object.keys(d.eat).sort().forEach(dt=>{
      const inc=d.eat[dt];
      if(!Array.isArray(inc)||!inc.length) return;
      if(store.eatLog.some(y=>y.d===dt)) return;
      store.eatLog.push({d:dt,start:0,end:0,rows:clone(inc)}); n.eat+=inc.length;
    });
    store.eatLog.sort((a,b)=>a.d<b.d?-1:1);
  }
  if(d.eatNow&&Array.isArray(d.eatNow.rows)&&d.eatNow.rows.length
     &&!(store.eatNow&&Array.isArray(store.eatNow.rows)&&store.eatNow.rows.length)){
    store.eatNow=clone(d.eatNow); n.eat+=d.eatNow.rows.length;
  }

  if(d.bk) store.bk=Math.max(store.bk||0,d.bk);
  return n;
}

/* ================= public API ================= */
const API={
  async init(){
    const raw=await Store.readLocal();
    if(raw){ try{ store=JSON.parse(raw); }catch(e){ store={}; } }
    normalize();
    day=todayDayId()||store.program[0].id;
    if(!plan()) day=store.program[0].id;
    home=true;
    render();
    if(migWrote){ migWrote=false; save(); }
  },
  /* the account had a newer copy than this phone: show it and keep it here too */
  async load(raw){
    try{ store=JSON.parse(raw); }catch(e){ return; }
    normalize();
    if(!plan()) day=store.program[0].id;
    confirmId=null;
    render();
    if(migWrote){ migWrote=false; save(); } else await Store.write(JSON.stringify(store));
  },
  go(id){ home=false; day=id; confirmId=null; editing=false; openId=null; render();
    ROOT().scrollIntoView({block:"start"}); },
  home(){ home=true; editing=false; confirmId=null; openId=null; render();
    ROOT().scrollIntoView({block:"start"}); },
  isHome(){ return home; },
  jump(dayId,ei){ home=false; day=dayId; editing=false; confirmId=null; render(); API.history(ei); },
  toggleEdit(){ editing=!editing; confirmId=null; render(); ROOT().scrollIntoView({block:"start"}); },

  /* Open one exercise by hand. Tapping the open one again lets the day go back
     to following whichever exercise is next. */
  openOne(id){
    openId=(openId===id)?null:id;
    render();
    if(openId){
      const el=document.querySelector('#g4 section.ex.cur');
      if(el) el.scrollIntoView({block:"center",behavior:"smooth"});
    }
  },
  closeDay(){
    const g=dayGaps();
    if(g.hard.length||g.soft.length){
      closeAll();
      fsheet("Close the day","Everything has to carry a number first.","",gapBody());
      return;
    }
    const s=todaySess();
    const did=sessSets(s);
    s.closed=Date.now();
    if(!s.t1) s.t1=s.closed;
    openId=null;
    save(); render();
    closeAll();
    /* nothing was logged, so there is nothing to celebrate — just lock it */
    if(did) fsheet("Session complete",esc(plan().day)+" · "+esc(plan().label)+" · "+fmt(s.date),"",finishBody());
  },
  reopenDay(){ const s=todaySess(); delete s.closed; save(); render(); },
  gapGo(ei,si){
    const e=plan().ex[ei]; if(!e) return;
    closeAll();
    openId=e.id; render();
    const row=$("g4r-"+ei+"-"+si);
    if(row){
      row.scrollIntoView({block:"center"});
      const ins=row.querySelectorAll("input");
      const t=[].slice.call(ins).find(x=>!x.value)||ins[0];
      if(t) t.focus();
    }
  },
  skipEx(id){
    const s=todaySess();
    s.skip=Array.isArray(s.skip)?s.skip:[];
    const i=s.skip.indexOf(id);
    if(i>=0) s.skip.splice(i,1); else s.skip.push(id);
    if(!s.skip.length) delete s.skip;
    save(); render();
    const w=document.querySelector("#g4 .fsheet .fsbody");
    if(w) w.innerHTML=gapBody();
  },
  /* Writes the ladder the app already worked out into the empty rows. */
  fillNext(ei){
    const p=plan(), e=p.ex[ei];
    const pr=prevFor(e.id); if(!pr) return;
    const L=nextFor(e,pr.sets,latOf(e,day));
    if(!L||!L.items||!L.items.length) return;
    const s=todaySess();
    const arr=s.ex[e.id]=s.ex[e.id]||[];
    for(let k=0;k<e.s;k++) arr[k]=arr[k]||["","",""];
    if(arr.some(filled)) return;
    L.items.forEach((x,i)=>{
      if(i>=e.s) return;
      while(arr[i].length<3) arr[i].push("");
      arr[i][0]=String(x.w); arr[i][1]=String(x.r);
    });
    dlMark(s,e.id);
    stamp(s);
    /* stay on this exercise so he can edit what was just written; he moves on
       by tapping the next one himself */
    openId=e.id;
    GYM4.awake(); save(); render();
  },
  log(ei,si,f,val){
    const p=plan(), e=p.ex[ei], s=todaySess();
    const arr=s.ex[e.id]=s.ex[e.id]||[];
    for(let k=0;k<e.s;k++) arr[k]=arr[k]||["","",""];
    while(arr[si].length<3) arr[si].push("");
    arr[si][f]=val;
    if(!arr.some(x=>x[0]!==""||x[1]!=="")) delete s.ex[e.id];
    else dlMark(s,e.id);
    stamp(s);
    save();
    /* the same lookup logView draws the row from, so the arrow cannot disagree
       with the chips above it */
    const pr0=prevFor(e.id);
    const ps=pr0?pr0.sets:null;
    const row=$("g4r-"+ei+"-"+si);
    if(row){
      const ins=row.querySelectorAll("input");
      row.querySelector(".mark").setAttribute("data-state",
        dlFor(e.id)?"":mark([ins[0].value,ins[1].value,arr[si][2]||""], ps&&ps[si]?ps[si]:null));
      for(let k=0;k<ins.length;k++){
        const fld=ins[k].parentElement;
        if(fld) fld.classList.toggle("has",ins[k].value!=="");
      }
    }
    /* the three numbers up top are meant to move as he logs, not only when
       the page redraws */
    const lv=$("g4live");
    if(lv&&p) lv.innerHTML=liveBits(p,s);
    /* the same count and minutes render() writes, so the header does not jump */
    const done=p.ex.filter(x=>exDone(s,x)).length, mins=sessMins(s);
    $("g4h2").textContent=fmt(gymIso())+" · "+done+" of "+p.ex.length+" exercises"+
      (mins?" · "+mins+" min":"");
  },

  set(i,key,val){
    const e=plan().ex[i];
    if(key==="s") e.s=Math.max(1,Math.min(10,parseInt(val,10)||1));
    else if(key==="n") e.n=String(val).trim()||"Untitled";
    else if(key==="m") e.m=String(val);
    else if(key==="h") e.h=String(val).trim()||"general";
    else if(key==="step"){ const v=parseFloat(val); if(v>0) e.step=v; else delete e.step; }
    else if(key==="cap"){ const v=parseFloat(val); if(v>0) e.cap=v; else delete e.cap; }
    else if(key==="rungs"){
      const v=String(val||"").replace(/[^0-9.]+/g," ").trim();
      if(v) e.rungs=v; else delete e.rungs;
      latCache={};
    }
    else e.r=String(val).trim()||"8-12";
    save(); render();
  },
  /* moves a unit past the unit next to it: one exercise, or a superset pair as
     a whole, so nothing ever lands between the two of a pair */
  move(i,d){
    const p=plan(), U=ssUnits(p.ex);
    const k=U.findIndex(u=>u.indexOf(i)>=0), j=k+d;
    if(k<0||j<0||j>=U.length) return;

  libFilt(){
    const box=$("g4xl"), cb=$("g4xc"); if(!box||!cb) return;
    const qv=(($("g4xq")||{}).value||"").trim(), q=qv.toLowerCase();
    const p=plan(), K=x=>String(x||"").toLowerCase().replace(/\s+/g," ").trim();
    const inDay={}; (p.ex||[]).forEach(e=>{ inDay[K(e.n)]=1; });
    /* the newest numbers he has for each name, from any day or the bench */
    const last={}, mine={};
    const libNames={}; EXLIB.forEach(x=>{ libNames[K(x[0])]=1; });
    (store.program||[]).concat(store.archive||[]).forEach(d=>{
      (d.ex||[]).concat(d.bench||[]).forEach(e=>{
        if(!e||!e.n) return;
        const k=K(e.n), l=exLast(d.id,e.id);
        if(l&&(!last[k]||l.date>last[k].date)) last[k]={date:l.date,t:r1(l.w)+'kg × '+l.r+' · '+(d.day||d.label||"")};
        if(!libNames[k]&&!mine[k]) mine[k]={n:e.n,m:e.m||"other",h:e.h||"general",q:"Yours",own:1};

    xlRows=rows;
    const ok=r=>(!q||K(r.n).indexOf(q)>=0||K(MUSCLES[r.m]).indexOf(q)>=0||K(r.q).indexOf(q)>=0)&&
      (xlF==="all"||xlF===r.m||(xlF==="done"&&last[K(r.n)]));
    cb.innerHTML=[["all","All"],["done","Done before"]].concat(MZ.map(k=>[k,MUSCLES[k]]))
      .map(c=>'<button class="xlchip'+(xlF===c[0]?" on":"")+'" onclick="GYM4.libChip(\''+c[0]+'\')">'+esc(c[1])+'</button>').join("");
    const line=i=>{ const r=rows[i], L=last[K(r.n)];
      return '<button class="benchrow" onclick="GYM4.libPick('+i+')"><span class="bq" style="background:'+mcol(r)+'"></span>'+
        '<span class="bt"><b>'+esc(r.n)+'</b><em>'+esc(MUSCLES[r.m]||"Other")+' · '+esc(r.h)+(L?' · <i>Last '+esc(L.t)+'</i>':'')+'</em></span>'+

    MZ.forEach(m=>{

      /* what he has done before comes first */
      L.sort((a,b)=>(last[K(rows[b].n)]?1:0)-(last[K(rows[a].n)]?1:0)||a-b);
      if(L.length) h+='<p class="fcat">'+esc(MUSCLES[m])+' · '+L.length+'</p>'+L.map(line).join("");

  /* k: where the pair goes among the other exercises of the day */
  ssPlace(k){
    const p=plan(); if(!ssPick||ssPick.length!==2) return;
    const A=p.ex.find(e=>e.id===ssPick[0]), B=p.ex.find(e=>e.id===ssPick[1]);
    if(!A||!B||A===B) return;
    const rest=p.ex.filter(e=>e!==A&&e!==B);
    k=Math.max(0,Math.min(rest.length,k|0));
    rest.splice(k,0,A,B);
    A.ss=1; delete B.ss;
    p.ex.length=0; rest.forEach(e=>p.ex.push(e));
    ssClean(p);

  swapTo(i,id){

    /* the one coming in takes the outgoing one's place in a superset too */
    if(out.ss) incoming.ss=1; else delete incoming.ss;

    const rows=eatToday().map(r=>({n:r.n,v:+r[key]||0,q:qtyTxt(r)}))
      .filter(x=>x.v>0).sort((a,b)=>b.v-a.v);
    const tot=rows.reduce((a,x)=>a+x.v,0);
    const g=dietOf(), goal=(key==="k")?g.k:g[key];
    const over=tot>goal, d=Math.abs(tot-goal);
    closeAll();
    const kg=curKg();
    let body='<div class="mhead">'+
      '<div class="r"><span>Today</span><b>'+r1(tot)+UN[key]+'</b></div>'+

      '<div class="r"><span>Goal</span><b>'+r1(goal)+UN[key]+'</b></div>'+

  /* The plan's own settings. Each one is just a number on store.diet, so the
     screen stays a pure function of what he has set. */
  plSet(key,val){
    store.diet=Object.assign(seedDiet(),store.diet||{});
    if(key==="goal"){
      store.diet.goal=(val==="hold"||val==="gain")?val:"lose";
      /* the rates on offer differ between losing and gaining, so land on one
         that exists rather than leaving a dead selection */
      const RS=planRates();
      if(RS.indexOf(+store.diet.rate)<0) store.diet.rate=RS[RS.length-1];
      if(store.diet.goal==="hold") store.diet.rate=0;
    }
    else if(key==="rate") store.diet.rate=Math.max(0,parseFloat(val)||0);
    else if(key==="ppk"){
      const v=parseFloat(val);
      store.diet.ppk=(isFinite(v)&&v>=1&&v<=4)?v:2.2;
    }
    else if(key==="burn") store.diet.burn=Math.max(0,Math.round(parseFloat(val)||0));
    else if(key==="tgtkg"){
      const v=parseFloat(val);
      store.diet.tgtkg=(isFinite(v)&&v>0)?v:0;
    }
    else return;
    save(); render();
  },

    store.diet=Object.assign(seedDiet(),store.diet||{});
    store.diet.burnMode=(m==="typed")?"typed":"auto";

  plWeigh(v){

    const d=iso();
    store.weights=(store.weights||[]).filter(x=>x&&x.d!==d);
    store.weights.push({d:d,v:Math.round(n*10)/10});
    store.weights.sort((a,b)=>a.d<b.d?-1:1);
    save(); render();

  /* File the open day and start a fresh one. The clock plays no part: it closes
     when he says so. Two taps, because a stray tap would split his day in half. */
  fdClose(btn){
    if(btn&&btn.getAttribute("data-arm")!=="1"){
      btn.setAttribute("data-arm","1");
      btn.textContent="Sure? Tap again";
      setTimeout(function(){
        if(btn&&btn.parentNode){ btn.removeAttribute("data-arm"); btn.textContent=CLOSE_LABEL; }
      },4000);
      return;
    }
    const cur=eatNowW();
    if(cur.rows.length){
      store.eatLog=Array.isArray(store.eatLog)?store.eatLog:[];
      /* a day that runs past midnight is still that day, so date it by its start */
      const st=cur.start||Date.now();
      const d=iso(new Date(st));
      const had=store.eatLog.find(x=>x&&x.d===d);
      /* two records on one date would be counted as one enormous day by every
         average, so the rows join the day that is already there */
      if(had){ had.rows=(had.rows||[]).concat(cur.rows); had.end=Date.now(); }
      else store.eatLog.push({d:d,start:st,end:Date.now(),rows:cur.rows});
      while(store.eatLog.length>60) store.eatLog.shift();
    }
    store.eatNow={start:0,rows:[]};
    save(); render();
  },

  /* Reads the form once, so the preview and the save can never disagree. */
  fdNewRead(){
    const V=id=>{ const e=$(id); return e?e.value:""; };
    const num=id=>Math.max(0,parseFloat(V(id))||0);
    let u=V("g4nu")||"g";
    if(u!=="ml"&&u!=="pc") u="g";
    const pr=num("g4np"), ft=num("g4nf"), cb=num("g4nb");
    let k=parseFloat(V("g4nk"));
    if(!isFinite(k)||k<0) k=Math.round(pr*4+ft*9+cb*4);
    let n=String(V("g4nn")).trim();
    /* a pack size turns the per-100 numbers into one piece */
    const sz=(u==="pc")?0:num("g4nsz");
    const cat=V("g4nc");
    let out={n:n,u:u,k:k,p:pr,f:ft,b:cb,sz:sz,c:(FCATS.indexOf(cat)>=0?cat:"Other")};
    if(sz>0){
      const m=sz/100;
      out={n:n,u:"pc",k:Math.round(k*m),p:r1(pr*m),f:r1(ft*m),b:r1(cb*m),sz:sz,c:out.c};
      const tag=sz+(u==="ml"?"ml":"g");
      if(n&&n.indexOf(String(sz))<0) out.n=n+" \u2014 "+tag;

  async saveBackup(btn){
    const name="gym-backup-"+iso()+".json";
    const txt=JSON.stringify(store,null,1);
    const blob=new Blob([txt],{type:"application/json"});
    const done=()=>{
      store.bk=Date.now(); save();
      if(btn) btn.textContent="Saved \u2713";
      const w=document.querySelector("#g4 .bkslim")||document.querySelector("#g4 .bkwarn");
      if(w) w.outerHTML='<div class="hint">Backup saved. Keep it in Files or iCloud.</div>';
    };
    // 1. share sheet with a real file (Save to Files, AirDrop, WhatsApp...)
    try{
      if(navigator.share&&navigator.canShare&&typeof File==="function"){
        const file=new File([blob],name,{type:"application/json"});
        if(navigator.canShare({files:[file]})){
          await navigator.share({files:[file],title:name});
          done(); return;
        }
      }
    }catch(e){
      if(e&&e.name==="AbortError") return;   // cancelled on purpose, not a failure
    }
    // 2. plain download
    try{
      const url=URL.createObjectURL(blob);
      const a=document.createElement("a");
      a.href=url; a.download=name; a.rel="noopener";
      ROOT().appendChild(a); a.click(); a.remove();
      setTimeout(()=>URL.revokeObjectURL(url),4000);
      done();
    }catch(e2){ if(btn) btn.textContent="Could not save the file"; }
  },

  async _snapLoad(d,btn){

    if(n.sessions) bits.push(n.sessions+" session"+(n.sessions>1?"s":""));
    if(n.sets) bits.push(n.sets+" logged lift"+(n.sets>1?"s":""));
    if(n.weights) bits.push(n.weights+" weigh-in"+(n.weights>1?"s":""));
    if(n.measures) bits.push(n.measures+" measurement"+(n.measures>1?"s":""));
    if(n.ex) bits.push(n.ex+" exercise"+(n.ex>1?"s":""));
    if(n.lib) bits.push(n.lib+" food item"+(n.lib>1?"s":""));

    closeAll(); render();
    sheet('<h2>Restored</h2><p class="sub">'+(bits.length

  async snapReplace(d,btn){
    if(btn.getAttribute("data-arm")!=="1"){

      return;
    }
    const o=await API._snapLoad(d,btn); if(!o) return;
    /* the list of restore points describes the account now, not that day */
    const idxNow=store.snapIdx;
    store=o;
    if(Array.isArray(idxNow)) store.snapIdx=idxNow; else delete store.snapIdx;
    store.snapDay=iso();        /* keep today's point, do not overwrite it on next open */
    normalize();
    if(!plan()) day=store.program[0].id;
    editing=false; confirmId=null; save();
    closeAll(); render();
    sheet('<h2>Replaced</h2><p class="sub">Your data is back to exactly how it was on '+fmt(d)+'.</p>');

  doRestore(input){
    const msg=$("g4rmsg");
    const f=input&&input.files&&input.files[0];
    if(!f) return;
    const r=new FileReader();
    r.onerror=function(){ if(msg) msg.textContent="Could not read that file."; };
    r.onload=function(){
      let d;
      try{ d=JSON.parse(String(r.result)); }
      catch(e){ if(msg) msg.textContent="That file is not a valid backup."; return; }
      if(!d||typeof d!=="object"||Array.isArray(d)){
        if(msg) msg.textContent="That file is not a valid backup."; return;
      }
      const n=mergeIn(d);
      normalize();
      if(!plan()) day=store.program[0].id;
      editing=false; confirmId=null;
      save();
      const bits=[];
      if(n.days) bits.push(n.days+" day"+(n.days>1?"s":""));
      if(n.ex) bits.push(n.ex+" exercise"+(n.ex>1?"s":""));
      if(n.lib) bits.push(n.lib+" food item"+(n.lib>1?"s":""));
      if(n.sessions) bits.push(n.sessions+" session"+(n.sessions>1?"s":""));
      if(n.sets) bits.push(n.sets+" logged lift"+(n.sets>1?"s":""));
      if(n.weights) bits.push(n.weights+" weigh-in"+(n.weights>1?"s":""));
      if(n.measures) bits.push(n.measures+" measurement"+(n.measures>1?"s":""));
      if(n.eat) bits.push(n.eat+" food entr"+(n.eat>1?"ies":"y"));
      if(msg) msg.innerHTML=bits.length
        ? "Added "+bits.join(", ")+". Nothing was deleted."
        : "That backup was already here. Nothing changed.";
      render();
    };
    r.readAsText(f);
  },
  reset(btn){
    if(btn.dataset.armed==="1"){
      /* Sets are filed under the exercise id, and the original list's ids are
         only its positions, which no longer match an older log. So an exercise
         keeps the id it already has, found by name; a new one never borrows an
         id that already carries numbers; and anything not in the original list
         goes to the bench with its history instead of disappearing. */
      const K=s=>String(s||"").toLowerCase().replace(/\s+/g," ").trim();
      const fresh=seed();
      const arch=Array.isArray(store.archive)?store.archive:[];
      fresh.forEach(np=>{
        const op=(store.program||[]).find(p=>p.id===np.id)||arch.find(p=>p.id===np.id);
        const old=op?(op.ex||[]).concat(op.bench||[]):[];
        const ss=((store.days||{})[np.id]||{}).sessions||[];
        const hasHist=id=>ss.some(x=>x&&x.ex&&x.ex[id]);
        const used={};
        np.ex.forEach(ne=>{
          const m=old.find(o=>o&&!used[o.id]&&K(o.n)===K(ne.n));
          if(m){
            ne.id=m.id; used[m.id]=1;
            /* the plate numbers belong to the machine, not the program */
            if(m.step) ne.step=m.step;
            if(m.cap) ne.cap=m.cap;
            if(m.rungs) ne.rungs=m.rungs;
          }else if(old.some(o=>o&&o.id===ne.id)||hasHist(ne.id)) ne.id=uid();
        });
        np.bench=old.filter(o=>o&&!used[o.id]);
      });
      /* days he added himself are not in the original, so they go to the
         archive with their sessions instead of vanishing */
      const own=(store.program||[]).filter(p=>!fresh.some(f=>f.id===p.id));
      store.archive=arch.filter(a=>!fresh.some(f=>f.id===a.id)).concat(own);
      store.program=fresh; editing=false; confirmId=null;
      if(!plan()) day=store.program[0].id;
      save(); closeAll(); render(); return;
    }
    btn.dataset.armed="1"; btn.textContent="Tap again to confirm reset";
    setTimeout(()=>{ if(btn.dataset.armed==="1"){ btn.dataset.armed="0"; btn.textContent="Reset program to original"; } },4000);
  },
  closeSheet(btn){
    const s=btn.closest(".sheet")||btn.closest(".fsheet");
    if(s) s.remove();
    stopScanner();
    if(!document.querySelector("#g4 .fsheet")){
      let gone=false;
      if(fdWhere!==null){ fdWhere=null; gone=true; }
      /* closing the sheet by hand is a cancel: do not keep a basket nobody can see */
      if(cbBuild){ cbBuild=null; gone=true; }
      if(gone) render();
    }
  },

  wadd(){
    const inp=$("g4w"), v=parseFloat(inp.value);
    if(!isFinite(v)||v<=0) return;
    const t=iso();
    store.weights=store.weights.filter(e=>e.d!==t);
    store.weights.push({d:t,v:v});
    save(); render();
  },
  wdel(d){ store.weights=store.weights.filter(e=>e.d!==d); save(); render(); },
  madd(){
    const rec={d:iso()};
    let any=false;
    MF.forEach(f=>{
      const el=$("g4m-"+f[0]); if(!el) return;
      const v=parseFloat(el.value);
      if(isFinite(v)&&v>0){ rec[f[0]]=v; any=true; }
    });
    const he=$("g4m-height"), hv=he?parseFloat(he.value):NaN;
    const hok=isFinite(hv)&&hv>120&&hv<250;
    if(hok) store.height=hv;
    if(!any){ if(hok){ save(); render(); } return; }
    /* saving twice on the same day fills in, it does not wipe what you left blank */
    const old=(store.measures||[]).find(e=>e.d===rec.d);
    if(old) MF.forEach(f=>{ if(rec[f[0]]===undefined){ const o=mval(old,f[0]); if(o!==null) rec[f[0]]=o; } });
    store.measures=(store.measures||[]).filter(e=>e.d!==rec.d);
    store.measures.push(rec);
    save(); render();
  },
  signOut(btn){
    if(btn.getAttribute("data-arm")!=="1"){ btn.setAttribute("data-arm","1"); btn.textContent="Sure? Tap again"; setTimeout(function(){ btn.removeAttribute("data-arm"); btn.textContent="Sign out"; },3000); return; }
    window.FB.signOut();
  },
  mdel(d){ store.measures=(store.measures||[]).filter(e=>e.d!==d); save(); render(); },
  /* read-only handles on the weight-grid maths, so the test suite can check it
     against the real log instead of guessing from the screen. Changes nothing. */
  __p(){ return store.program; },
  __plan(){ return planCalc(); },
  __merge(d){ const n=mergeIn(d); save(); render(); return n; },
  __setCat(id,c){ const x=(store.lib||[]).find(y=>y.id===id); if(x){ x.c=c; save(); render(); } },
  __preal(){ return planReal(); },
  __lat(e,d){ return latOf(e,d); },
  __latUp(f,w){ return latUp(f,w); },
  __latSnap(f,w){ return latSnap(f,w); },
  __series(d,id){ return exSeries(d,id); },
  __ladder(sets,r,n,f){ return nextLadder(sets,r,n,f); }
};


/* ---------- Arabic digits ----------
   The Arabic keyboard on his phone types ٠١٢ and iOS gives no way to make it
   type 012 unless the whole phone is switched to Arabic. A number box throws
   those characters away without a word - it simply reads back empty - so the
   boxes take text and the digits are folded here, in the capture phase, before
   any field's own handler reads the value. Folding covers Arabic-Indic and
   Persian digits and the Arabic decimal and thousands marks. Since the boxes
   are no longer type="number", anything that is not part of a number is also
   dropped, which a number box used to do for us: pasting "60 kg" leaves 60. */
(function(){
  const EL=document.getElementById("g4");
  if(!EL) return;
  const AR=/[\u0660-\u0669\u06F0-\u06F9\u066B\u066C\u060C\u06F0]/;
  function fold(v){
    return String(v)
      .replace(/[\u0660-\u0669]/g,d=>String.fromCharCode(d.charCodeAt(0)-0x0660+48))
      .replace(/[\u06F0-\u06F9]/g,d=>String.fromCharCode(d.charCodeAt(0)-0x06F0+48))
      .replace(/[\u066B\u060C]/g,".")
      .replace(/\u066C/g,"");
  }
  function clean(v,dec){
    /* nothing he types here can be below zero, so a minus is dropped like any other stray */
    let out=fold(v).replace(dec?/[^0-9.]/g:/[^0-9]/g,"");
    /* one dot */
    const i=out.indexOf(".");
    if(i>=0) out=out.slice(0,i+1)+out.slice(i+1).replace(/\./g,"");
    return out;
  }
  function tidy(ev){
    const el=ev.target;
    if(!el||el.tagName!=="INPUT") return;
    const im=(el.getAttribute("inputmode")||"").toLowerCase();
    /* a box that takes several numbers folds its digits but keeps the gaps */
    const list=el.getAttribute("data-nums")==="list";
    if(!list&&im!=="decimal"&&im!=="numeric") return;
    const v=el.value;
    if(v==="") return;
    const n=list?fold(v).replace(/[^0-9.,\u0020]/g,""):clean(v,im==="decimal");
    if(n===v) return;
    /* keep the caret where he left it, allowing for characters dropped */
    let p=el.selectionStart;
    if(typeof p==="number") p=Math.max(0,p-(v.length-n.length));
    el.value=n;
    try{ el.setSelectionRange(p,p); }catch(e){}
  }
  EL.addEventListener("input",tidy,true);
  EL.addEventListener("change",tidy,true);
  /* the sign-in box lives outside #g4 and takes no numbers, so it is left alone */
})();

/* ---------- drag sideways to come back ----------
   Listens anywhere on the page rather than at the screen edge: in plain Safari
   an edge drag is the browser's own back gesture and would leave the app. The
   gesture is ignored on the home screen, inside a number box, and on anything
   that scrolls sideways itself. Either direction works. */
(function(){
  const EL=document.getElementById("g4");
  if(!EL) return;
  let x0=0, y0=0, t0=0, live=false;

  function scrollsSideways(n){
    while(n&&n!==EL){
      if(n.scrollWidth>n.clientWidth+4){
        const o=getComputedStyle(n).overflowX;
        if(o==="auto"||o==="scroll") return true;
      }
      n=n.parentElement;
    }
    return false;
  }
  function blocked(n){
    if(!n||!n.closest) return true;
    if(n.closest("input,textarea,select,button,a,[contenteditable]")) return true;
    return scrollsSideways(n);
  }

  EL.addEventListener("touchstart",function(e){
    live=false;
    if(e.touches.length!==1) return;
    if(blocked(e.target)) return;
    const t=e.touches[0];
    x0=t.clientX; y0=t.clientY; t0=Date.now(); live=true;
  },{passive:true});

  EL.addEventListener("touchend",function(e){
    if(!live) return;
    live=false;
    const t=e.changedTouches&&e.changedTouches[0];
    if(!t) return;
    const dx=t.clientX-x0, dy=t.clientY-y0, ms=Date.now()-t0;
    /* a real sideways flick: far enough, clearly horizontal, and not a slow drag */
    if(Math.abs(dx)<70) return;
    if(Math.abs(dx)<Math.abs(dy)*1.6) return;
    if(ms>800) return;
    back();
  },{passive:true});

  EL.addEventListener("touchcancel",function(){ live=false; },{passive:true});

  /* a panel on top of the day closes first, the day itself comes second */
  function back(){
    if(document.querySelector("#g4 .sheet, #g4 .fsheet")){
      /* the same cancel the × button does: camera off, and forget a closed
         food day or a half-built combo, so the next tap lands on the open day */
      closeAll();
      stopScanner();
      let gone=false;
      if(fdWhere!==null){ fdWhere=null; gone=true; }
      if(cbBuild){ cbBuild=null; gone=true; }
      if(gone) render();
      return;
    }
    if(window.GYM4&&GYM4.isHome&&GYM4.isHome()) return;
    if(window.GYM4&&GYM4.home) GYM4.home();
  }
})();

/* The device key: made once on the first phone, kept in both stores like the log */
const DKP="vdk.", ACP="vacc.";
async function keyGet(uid){
  let k=null;
  try{ k=localStorage.getItem(DKP+uid); }catch(e){}
  if(!k) k=await IDB.get(DKP+uid);
  if(typeof k==="string"&&k.length>=32){ await keyPut(uid,k); return k; }
  return null;
}
function keyPut(uid,k){ try{ localStorage.setItem(DKP+uid,k); }catch(e){} return IDB.set(DKP+uid,k); }
function keyNew(){
  const a=new Uint8Array(24); crypto.getRandomValues(a);
  return Array.from(a,b=>("0"+b.toString(16)).slice(-2)).join("");
}
/* what the account looked like last time, so a gym with no signal still opens */
function accSave(uid,o){ try{ localStorage.setItem(ACP+uid,JSON.stringify(o)); }catch(e){} }
function accLoad(uid){ try{ return JSON.parse(localStorage.getItem(ACP+uid)||"null"); }catch(e){ return null; } }
const untilOf=p=>(p&&p.until&&p.until.toMillis)?p.until.toMillis():0;

/* Starter data (new account) or data moved off an old phone (device reset)
   waits in hold/. The rules open it for 10 minutes after the phone is linked. */
async function pullHold(uid,key){
  const H="users/"+uid+"/hold", B="users/"+uid+"/v/"+key;
  let hold=[];
  try{ hold=await window.FB.listSrv(H); }catch(e){ return; }
  if(!hold.length) return;
  try{
    const st=hold.find(x=>x.id==="state");
    if(st&&st.data&&st.data.s){
      let cur=null; try{ cur=await window.FB.getSrv(B); }catch(e){}
      if(!cur||!cur.s||(+st.data.ts||0)>(+cur.ts||0)) await window.FB.put(B,{s:st.data.s,ts:+st.data.ts||Date.now()});
    }
    for(const x of hold) if(x.id.indexOf("snap_")===0) await window.FB.put(B+"/snap/"+x.id,x.data);
    for(const x of hold) await window.FB.del(H+"/"+x.id);
  }catch(e){}
}

async function start(){
  if(started) return; started=true;
  const u=window.FB.user, me=u&&u.uid;
  const as=new URLSearchParams(location.search).get("as");
  if(me===window.FB.OWNER){
    if(as&&as!==me) return startView(as,"admin.html");
    return openLog();
  }
  /* a coach opening one of their subscribers, or one of their ready programs */
  const tpl=new URLSearchParams(location.search).get("tpl");
  if((as&&as!==me)||tpl){
    let mine=null; try{ mine=await window.FB.getSrv("users/"+me); }catch(e){}
    if(mine&&mine.role==="coach"&&mine.active===true) return tpl?startTpl(me,tpl):startView(as,"coach.html");
  }
  return startUser(u);
}

/* A coach's ready program opened in the app's own editor (index.html?tpl=ID).
   It is a log of its own with nothing logged; only its training days are
   ever given to subscribers. No phone copy, no restore points. */
const MIG_ALL=()=>({days1:1,food1:1,food2:1,food3:1,food4:1,food5:1,food6:1,food7:1,food8:1,sess1:1,eat1:1,arm1:1,order1:1,reps1:1,split1:1,split2:1});
async function startTpl(me,id){
  Store.noLocal=true; KEY="gym4.tpl";
  $("lg").hidden=true;
  const T="coachTpl/"+me+"/t/"+id;
  let t=null;
  try{ t=await window.FB.getSrv(T); }catch(e){}
  if(!t) return gate("Not found",P_("This ready program was not found, or no internet.")+
    '<a class="lgbtn" href="coach.html">Back</a>',{noCoach:true,retry:true});
  window.FB.setPath(T,T+"/snap",true);
  /* a ready program saved before it could be edited here holds only its days */
  if(!t.s&&t.prog){
    let days=[]; try{ days=JSON.parse(t.prog); }catch(e){}
    const st={program:days.map(d=>({id:uid(),day:d.day,short:d.short,label:d.label,wd:d.wd===undefined?null:d.wd,bench:[],
      ex:(d.ex||[]).map(e=>Object.assign({},e,{id:uid()}))})),archive:[],mig:MIG_ALL(),ts:Date.now()};
    try{ await window.FB.write(JSON.stringify(st),st.ts); }catch(e){ return gateNet(); }
  }
  ACC={mode:"view",tpl:true,uid:me,name:t.name||"",lastTs:0,back:"coach.html"};
  document.title="Editing "+(t.name||"program")+" · Ventor";
  paintAcct();
  return openLog({view:true});
}

async function startUser(u){
  const uid=u.uid, U="users/"+uid;
  if(isIOS()&&!isStandalone()){ window.FB.signOut(); return; }
  $("lg").hidden=true;
  let prof=null, offline=false;
  try{ prof=await window.FB.getSrv(U); }
  catch(e){ if(e&&e.code==="permission-denied") prof=null; else offline=true; }
  const c=accLoad(uid);
  if(offline){
    if(!c||!c.key) return gateNet();
    prof={active:true,name:c.name,free:c.free,role:c.role,train:c.train};
  }
  if(!prof||prof.active!==true)
    return gate("Account not active",P_("Your account is not active right now. Contact your coach to turn it on."),{out:true});
  /* a coach without a training log of their own only has the coach page */
  if(prof.role==="coach"&&prof.train!==true)
    return gate("Coach account",P_("This account manages your subscribers. Open the coach page to see them.")+
      '<a class="lgbtn" href="coach.html">Open coach page</a>',{out:true,noCoach:true});
  const until=offline?(+c.until||0):untilOf(prof), now=Date.now();
  if(now>=until+GRACE) return gateEnded();
  const ro=now>=until;
  let key=await keyGet(uid);
  if(!offline){
    let linked=false;
    if(key){
      try{ await window.FB.getSrv(U+"/v/"+key); linked=true; }
      catch(e){ if(!e||e.code!=="permission-denied") return gateNet(); }
    }
    if(!linked){
      /* a phone can only be linked while the subscription runs */
      if(ro) return gateEnded();
      if(!key){ key=keyNew(); await keyPut(uid,key); }
      try{ await window.FB.put("devlock/"+uid,{k:key,t:window.FB.now()}); }
      catch(e){
        if(e&&e.code==="permission-denied")
          return gate("Another device",P_("This account is linked to another device. If you changed your phone, ask your coach to reset your device."),{out:true});
        return gateNet();
      }
    }
    await pullHold(uid,key);
    window.FB.put(U+"/meta/seen",{t:window.FB.now()}).catch(function(){});
    accSave(uid,{name:prof.name||"",free:!!prof.free,until:until,key:key,role:prof.role||"",train:prof.train===true});
  }else if(!key) return gateNet();
  ACC={mode:"user",uid:uid,name:prof.name||"",until:until,free:!!prof.free,ro:ro,vpath:U+"/v/"+key,coachRole:prof.role==="coach"};
  KEY="gym4.u."+uid;
  window.FB.setPath(U+"/v/"+key,U+"/v/"+key+"/snap");
  Store.onDenied=function(){ recheck(true); };
  paintAcct();
  return openLog({ro:ro});
}

function ago(t){
  const m=Math.max(0,Math.round((Date.now()-t)/6e4));
  return m<1?"just now":m<60?m+" min ago":m<1440?Math.round(m/60)+" h ago":Math.round(m/1440)+" days ago";
}
/* Home: the last three days of a paid subscription, counted in Riyadh days */

  if(ACC.mode!=="user"||ACC.free||ACC.ro||!ACC.until) return "";
  const rd=t=>Math.floor((t+3*36e5)/864e5);

  return '<div class="warn">'+(d<=0?"Your subscription ends today.":d===1?"Your subscription ends tomorrow.":"Your subscription ends in "+d+" days.")+
    ' <a href="'+WA+'" target="_blank" rel="noopener" style="color:inherit;font-weight:700">Contact Coach</a></div>';
}

/* read-only: anything changed on screen goes back to how it was */
function roRevert(){
  if(!RO_RAW) return;

  normalize(); migWrote=false;
  render();
  note("Read only – your subscription ended. Nothing was saved.");
}
/* A subscriber's account is looked at again when the app comes back (at most
   once an hour), and at once if the account refuses a save. */
let chkAt=0;
async function recheck(force){
  if(ACC.mode!=="user") return;
  if(!force&&Date.now()-chkAt<36e5) return;
  chkAt=Date.now();
  let prof;
  try{ prof=await window.FB.getSrv("users/"+ACC.uid); }catch(e){ return; }
  if(!prof||prof.active!==true){ location.reload(); return; }
  const until=untilOf(prof), now=Date.now();
  /* the state changed (renewed, ended, grace over): open again from the top */
  if((now>=until)!==!!ACC.ro||now>=until+GRACE){ location.reload(); return; }
  ACC.until=until; ACC.free=!!prof.free; ACC.name=prof.name||"";
  const c=accLoad(ACC.uid); if(c){ c.until=until; c.free=ACC.free; c.name=ACC.name; accSave(ACC.uid,c); }
  if(force){
    try{ await window.FB.getSrv(ACC.vpath); }
    catch(e){
      if(e&&e.code==="permission-denied"){
        gate("Another device",P_("This account is linked to another device. If you changed your phone, ask your coach to reset your device."),{out:true});
        return;
      }
    }
    const b=$("g4cloudErr"); if(b){ b.hidden=false; setTimeout(function(){ b.hidden=true; },5000); }
  }
  if(home) render();
}
/* A subscriber coming back to the app picks up anything their coach or the
   owner changed meanwhile, before they log over it. At most once a minute. */
let syncAt=0;
async function syncCloud(){
  if(ACC.mode!=="user"||!Store.cloud||Store.hold) return;
  if(Date.now()-syncAt<6e4) return;
  syncAt=Date.now();
  try{
    const c=await window.FB.read();
    if(c&&c.s&&Store.tsOf(c.s)>(store.ts||0)){
      await API.load(c.s);
      if(Store.readonly) RO_RAW=JSON.stringify(store);
    }
  }catch(e){}
}
/* The service worker keeps the newest index.html it fetched; if its APP_V
   differs from the one running, a newer version is one reload away. */
async function checkUpdate(){
  try{
    if(!("caches" in window)) return;
    const r=await caches.match("./index.html"); if(!r) return;
    const m=(await r.text()).match(/const APP_V="([^"]+)"/);
    if(m&&m[1]!==APP_V&&!$("g4upd")){
      const d=document.createElement("div"); d.id="g4upd";
      d.innerHTML='<span>New version available</span><button type="button">Update</button>';
      d.querySelector("button").onclick=function(){ location.reload(); };
      document.body.appendChild(d);
    }
  }catch(e){}
}
setTimeout(checkUpdate,6000);

async function openLog(o){
  o=o||{};
  Store.cloud=true; $("lg").hidden=true;
  if(o.ro){ Store.readonly=true; ROOT().classList.add("ro"); }
  /* Open straight away from this phone's copy, then check the account copy.
     If the phone has nothing saved, wait for the account like before, so an
     empty program is never shown or sent over the saved one. */
  Store.hold=true;
  const dev=await Store.readLocal();
  if(!dev) Store.hold=false;
  const baseTs=dev?Store.tsOf(dev):0;
  await API.init();
  if(Store.hold){
    try{
      const c=await window.FB.read();
      if(c&&c.s&&Store.tsOf(c.s)>baseTs) await API.load(c.s);
    }catch(e){}
    Store.hold=false;
  }
  /* read-only keeps this copy to go back to; viewing sends nothing on open */
  if(o.ro){ RO_RAW=JSON.stringify(store); return; }
  if(o.view) return;
  const raw=JSON.stringify(store);
  window.FB.write(raw,store.ts||Date.now()).catch(function(){});
  setTimeout(function(){ dailySnap(); },1500);
}

   Update it once and load again, so that page comes from the network. */
(function(){
