<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { initializeFirestore, persistentLocalCache, doc, getDocFromServer, getDoc, setDoc, collection, getDocs, deleteDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const app=initializeApp({apiKey:"AIzaSyCLxD-fduSa6kgqnk8pJj8HwtzY3AYfhIg",authDomain:"tarek-74842.firebaseapp.com",projectId:"tarek-74842",storageBucket:"tarek-74842.firebasestorage.app",messagingSenderId:"179196785540",appId:"1:179196785540:web:d4604f645dbbcc6e5f23d1"});
const auth=getAuth(app);
let fs; try{ fs=initializeFirestore(app,{localCache:persistentLocalCache()}); }catch(e){ fs=initializeFirestore(app,{}); }
const ref=doc(fs,"gym/state");
window.FB={
  async read(){ let d; try{ d=await getDocFromServer(ref); }catch(e){ try{ d=await getDoc(ref); }catch(x){ return null; } } return d.exists()?d.data():null; },
  write:(s,ts)=>setDoc(ref,{s:s,ts:ts}),
  /* Daily restore points. They live in the same collection as the live doc so the
     same security rule covers them, and nothing that writes the live doc touches them. */
  snap:(k,s,ts)=>setDoc(doc(fs,"gym","snap_"+k),{s:s,ts:ts,d:k}),
  snapList:async()=>{
    const out=[];
    try{
      const q=await getDocs(collection(fs,"gym"));
      q.forEach(x=>{ if(x.id.indexOf("snap_")===0){ const v=x.data()||{};
        out.push({d:v.d||x.id.slice(5), ts:v.ts||0, n:(v.s||"").length}); } });
    }catch(e){}
    return out.sort((a,b)=>a.d<b.d?1:-1);
  },
  snapGet:async(k)=>{ try{ const x=await getDoc(doc(fs,"gym","snap_"+k)); return x.exists()?x.data():null; }catch(e){ return null; } },
  snapDel:(k)=>deleteDoc(doc(fs,"gym","snap_"+k)),
  signIn:(e,p)=>signInWithEmailAndPassword(auth,e,p), signOut:()=>signOut(auth)
};
onAuthStateChanged(auth,u=>{ window.FB.user=u; window.dispatchEvent(new CustomEvent("fbauth",{detail:u})); });
</script>

<script>
window.GYM4 = (function(){
"use strict";
const KEY="gym4";
const $=id=>document.getElementById(id);

/* ================= storage ================= */
/* IndexedDB wrapper. iOS clears localStorage and IndexedDB on different
   schedules, so keeping a copy in both survives one of them being wiped. */
const IDB=(function(){
  const DB="gymdb", ST="kv";
  let dbp=null;
  const avail=(function(){ try{ return typeof indexedDB!=="undefined" && !!indexedDB; }catch(e){ return false; } })();
  function open(){
    if(dbp) return dbp;
    dbp=new Promise(function(res,rej){
      try{
        const r=indexedDB.open(DB,1);
        r.onupgradeneeded=function(){ try{ r.result.createObjectStore(ST); }catch(e){} };
        r.onsuccess=function(){ res(r.result); };
        r.onerror=function(){ rej(r.error); };
        r.onblocked=function(){ rej(new Error("blocked")); };
      }catch(e){ rej(e); }
    });
    return dbp;
  }
  return {
    avail: avail,
    async get(k){
      if(!avail) return null;
      try{
        const db=await open();
        return await new Promise(function(res,rej){
          const q=db.transaction(ST,"readonly").objectStore(ST).get(k);
          q.onsuccess=function(){ res(q.result||null); };
          q.onerror=function(){ rej(q.error); };
        });
      }catch(e){ return null; }
    },
    async set(k,v){
      if(!avail) return false;
      try{
        const db=await open();
        return await new Promise(function(res,rej){
          const q=db.transaction(ST,"readwrite").objectStore(ST).put(v,k);
          q.onsuccess=function(){ res(true); };
          q.onerror=function(){ rej(q.error); };
        });
      }catch(e){ return false; }
    }
  };
})();

const Store=(function(){
  /* Standalone build: everything lives in this browser. localStorage is the
     primary; IndexedDB is a second copy because iOS clears the two on
     different schedules, so losing one still leaves the other. */
  let mem=null, local=false;
  try{ localStorage.setItem(KEY+".p","1"); localStorage.removeItem(KEY+".p"); local=true; }catch(e){}
  const idb=IDB.avail;
  const ts=s=>{ try{ return JSON.parse(s).ts||0; }catch(e){ return 0; } };
  const newest=arr=>{ const v=arr.filter(Boolean); return v.length?v.sort((a,b)=>ts(b)-ts(a))[0]:null; };
  return {
    cloud:false,
    get label(){
      const n=[];
      if(this.cloud) n.push("your account");
      if(local) n.push("browser storage");
      if(idb) n.push("browser database");
      return n.length?n.join(" + "):"Not saving";
    },
    get durable(){ return false; },
    ok: true,
    async readLocal(){
      const found=[];
      if(this.cloud){ const c=await window.FB.read(); if(c&&c.s) found.push(c.s); }
      if(local){ try{ const v=localStorage.getItem(KEY); if(v) found.push(v); }catch(e){} }
      if(idb){ const v=await IDB.get(KEY); if(v) found.push(v); }
      return newest(found)||mem;
    },
    async write(s){
      let ok=false;
      if(local){ try{ localStorage.setItem(KEY,s); ok=true; }catch(e){} }
      if(idb){ if(await IDB.set(KEY,s)) ok=true; }
      if(!ok) mem=s;
      if(this.cloud){ clearTimeout(this._t); const self=this; this._t=setTimeout(function(){
        window.FB.write(s,ts(s)).catch(function(){ const b=document.getElementById("g4cloudErr"); if(b){ b.hidden=false; setTimeout(function(){b.hidden=true;},5000);} });
      },800); }
      return ok;
    }
  };
})();

  out.f=Math.round(kg*(goal==="lose"?0.8:1.0));
  out.b=Math.round((out.kcal-out.p*4-out.f*9)/4);
  out.ok=true;
  /* a plan he cannot run is not a plan */
  if(out.kcal<1200) out.warn="floor";
  else if(out.b<80){
    out.warn="carb";

    for(let i=0;i<PLRATES.length;i++){

      if(Math.round((k-out.p*4-out.f*9)/4)>=80){ out.fix=r; break; }
    }

/* How long to the weight he named, at the pace he is actually keeping. */
function planEta(pc){

  if((pc.goal==="lose")!==(diff<0)) return {wrongway:true,kg:Math.abs(diff)};
  const wks=Math.abs(diff)/pc.rate;

/* ================= analysis engine ================= */
const e1rm=(w,r)=>w*(1+r/30);
function mark(cur,prev){
  if(!filled(cur)||!filled(prev)) return "";
  const cw=+cur[0],cr=+cur[1],pw=+prev[0],pr=+prev[1];
  if(!isFinite(cw)||!isFinite(cr)||!isFinite(pw)||!isFinite(pr)||!pw) return "";
  const d=e1rm(cw,cr)-e1rm(pw,pr);
  if(Math.abs(d)<0.05) return "same";
  return d>0?"up":"down";
}
// best set of each session, oldest first, plus all sets of that session
function exSeries(dayId,exId){
  const out=[];
  ((store.days[dayId]||{sessions:[]}).sessions||[]).forEach(s=>{
    const sets=s.ex&&s.ex[exId]; if(!sets) return;
    let best=null; const all=[];
    sets.forEach(x=>{
      if(!filled(x)) return;
      const w=+x[0],r=+x[1];
      if(!isFinite(w)||!isFinite(r)||!w) return;
      all.push(x);
      const e=e1rm(w,r);
      if(!best||e>best.e) best={w:w,r:r,e:e};
    });
    if(best) out.push({date:s.date,w:best.w,r:best.r,e:best.e,all:all});
  });
  return out;
}
const repMax=r=>{const m=String(r).match(/(\d+)\s*-\s*(\d+)/);if(m)return +m[2];const s=String(r).match(/\d+/);return s?+s[0]:0;};
const stepOf=w=>w<15?1:w<30?2:w<60?2.5:5;
function nextWeight(sets,range,L){
  const done=(sets||[]).filter(filled);
  if(!done.length) return null;
  const top=repMax(range);
  if(!top||!done.every(x=>+x[1]>=top)) return null;
  const w=Math.max.apply(null,done.map(x=>+x[0]));
  if(!isFinite(w)||!w) return null;
  return latUp(L,w);
}
/* What to put on the bar next time, set by set.
   Two cases. If every set landed inside the rep range, each set keeps its weight
   and asks for one more rep, and a set that reached the top of the range goes up
   one step instead. If any set fell outside the range, the ladder is rebuilt from
   the session's best estimated max so that every set lands inside it — a 30kg set
   under a 6-10 prescription is not work, and creeping it to 16 reps makes it worse. */
const repLo=r=>{const m=String(r).match(/\d+/);return m?+m[0]:0;};
const roundKg=w=>w<20?Math.round(w):Math.round(w/2.5)*2.5;
/* The weights a machine can actually make.
   His gym runs Matrix, and Matrix plates are imperial - 10 lb (4.5 kg) or
   15 lb (6.8 kg) - so the kilos printed on a stack run 59, 66, 73 and never
   multiples of 5. Hard-coding one gym's table would break the day a machine
   changes, so the ladder is read off the weights he has actually used on this
   exercise: those numbers ARE the pin positions. A step set by hand on the
   exercise always wins, for a machine too new to have a history. */
const LSTEPS=[20,15,11.3,10,9,6.8,5,4.5,2.5,2.3,2,1.25,1];
const LTOL=0.65, LMIN=3;
let latCache={};
function latFit(ws){
  const u=[];
  ws.forEach(w=>{ if(!u.some(x=>Math.abs(x-w)<1e-9)) u.push(w); });
  u.sort((a,b)=>a-b);
  if(u.length<LMIN) return null;
  const span=u[u.length-1]-u[0];
  /* whole-kg stacks print whole kilos; only a log that holds a half tells us
     the exercise really moves in halves (dumbbells) */
  const half=u.some(x=>Math.abs(x-Math.round(x))>1e-9);
  /* A bigger step is usually the real stack, but not when it only fits sloppily:
     dumbbells going 18-20-22-24 match a 2 kg step exactly and a 2.3 kg one only
     within 0.6. Score every fit by size minus three times its worst error, so a
     clean small step beats a barely-fitting larger one while 6.8 still beats the
     1 kg grid that trivially fits any whole number. */
  let best=null;
  for(let i=0;i<LSTEPS.length;i++){
    const st=LSTEPS[i];
    if(st>span) continue;
    for(let j=0;j<u.length;j++){
      const b=u[j];
      let worst=0, fits=true;
      for(let k=0;k<u.length;k++){
        const d=Math.abs(b+Math.round((u[k]-b)/st)*st-u[k]);
        if(d>LTOL){ fits=false; break; }
        if(d>worst) worst=d;
      }
      if(!fits) continue;
      const sc=st-3*worst;
      if(!best||sc>best.sc) best={step:st,base:b,half:half,sc:sc};
      break;
    }
  }
  return best;
}
function latOf(e,dayId){
  if(!e) return null;
  const cap=(+e.cap>0)?+e.cap:0;
  if(+e.step>0) return {step:+e.step,base:(+e.base>0?+e.base:0),half:true,cap:cap};
  const k=(dayId||day)+"/"+e.id;
  let f=latCache[k];
  if(f===undefined){
    const ws=[];
    exSeries(dayId||day,e.id).forEach(p=>(p.all||[]).forEach(x=>{
      const w=+x[0]; if(isFinite(w)&&w>0) ws.push(w); }));
    f=latFit(ws); latCache[k]=f;
  }
  return {step:f?f.step:0,base:f?f.base:0,half:f?f.half:true,cap:cap};
}
const latRound=(L,v)=>(L&&L.step>0&&!L.half)?Math.round(v):Math.round(v*2)/2;
function latSnap(L,w){
  if(!isFinite(w)||w<=0) return w;
  let v;
  if(L&&L.step>0){
    v=L.base+Math.round((w-L.base)/L.step)*L.step;
    if(v<=0) v=L.base;
  } else v=roundKg(w);
  v=latRound(L,v);
  if(L&&L.cap>0&&v>L.cap) v=latRound(L,L.cap);
  return v;
}
function latUp(L,w){
  let v;
  if(L&&L.step>0){
    const n=Math.floor((w-L.base)/L.step+1e-6)+1;
    v=latRound(L,L.base+n*L.step);
    if(v<=w) v=latRound(L,L.base+(n+1)*L.step);
  } else v=Math.round((w+stepOf(w))*2)/2;
  if(L&&L.cap>0&&v>L.cap) return (L.cap>w)?latRound(L,L.cap):w;
  return v;
}
const atCap=(L,w)=>!!(L&&L.cap>0&&w>=L.cap-1e-9);
function nextLadder(ps,range,wantSets,L){
  const done=(ps||[]).filter(filled).map(x=>({w:+x[0],r:+x[1]}))
    .filter(x=>isFinite(x.w)&&isFinite(x.r)&&x.w>0&&x.r>0);
  if(!done.length) return null;
  const hi=repMax(range), lo=repLo(range);
  if(!hi||!lo||hi<lo) return null;

  /* 1. anything outside the range: rebuild the ladder so every set lands inside it */
  if(!done.every(x=>x.r>=lo&&x.r<=hi)){
    const E=Math.max.apply(null,done.map(x=>e1rm(x.w,x.r)));
    const n=Math.max(1,wantSets||done.length), items=[];
    for(let i=0;i<n;i++){
      const t=(n===1)?hi:Math.max(lo,Math.floor(hi-i*(hi-lo)/(n-1)));
      items.push({w:latSnap(L,E/(1+t/30)),r:t});
    }
    return {mode:"rebuilt",items:items};
  }

  /* 2. the heaviest set reached the top of the range: the whole ladder steps up,
        in proportion, so its shape survives. First session on new weights gets no
        rep target, only last time's reps to match. */
  let top=done[0];
  done.forEach(x=>{ if(x.w>top.w||(x.w===top.w&&x.r>top.r)) top=x; });
  if(top.r>=hi){
    /* the stack has no heavier pin: reps are the only way up */
    if(atCap(L,top.w))
      return {mode:"capped",items:done.map(x=>({w:x.w,r:x.r+1}))};
    const f=latUp(L,top.w)/top.w;
    return {mode:"stepped",items:done.map(x=>({w:latSnap(L,x.w*f),r:x.r}))};
  }

  /* 3. otherwise: same weights, one more rep on every set */
  return {mode:"bump",items:done.map(x=>({w:x.w,r:x.r+1}))};
}
function failureFlags(series,curSets){
  const bestAt={};
  series.forEach(s=>s.all.forEach(x=>{
    const w=+x[0],r=+x[1];
    if(bestAt[w]===undefined||r>bestAt[w]) bestAt[w]=r;
  }));
  const msgs=[];
  (curSets||[]).forEach((x,i)=>{
    if(!filled(x)) return;
    const w=+x[0],r=+x[1],rpe=(x[2]!==undefined&&x[2]!=="")?+x[2]:null;
    if(bestAt[w]!==undefined && bestAt[w]-r>=3)

    if(rpe!==null && rpe<=7)

  });

function stalled(series){

}
function fourWeek(series,now){

function weeklyVolume(now){

function chartSVG(pts,noPr){

  const Y=v=>H-pd-((v-lo)/span)*(H-2*pd);

  pts.forEach((p,i)=>{
    d+=(i?" L":"M")+X(i).toFixed(1)+" "+Y(p.e).toFixed(1);
    const pr=!noPr&&p.e>=hi-0.001;

      '" fill="'+(pr?"#ECB053":"#4CDCD6")+'"/>';
  });
  const area=d+" L"+X(pts.length-1).toFixed(1)+" "+(H-pd)+" L"+X(0).toFixed(1)+" "+(H-pd)+" Z";
  return '<svg viewBox="0 0 '+W+' '+H+'" width="100%" style="display:block;margin:10px 0 4px;height:auto">'+
    '<path d="'+area+'" fill="rgba(76,220,214,.14)"/>'+
    '<path d="'+d+'" fill="none" stroke="#4CDCD6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>'+
    dots+'</svg><div class="axis"><span>'+fmt(pts[0].date)+'</span><span>'+fmt(pts[pts.length-1].date)+'</span></div>';

function hasLogs(){

/* ================= the session as a whole ================= */
/* A colour per muscle, so Push day and Pull day do not look like the same page. */
const MCOL={chest:"#EAAB9F",back:"#8FBBE2",delts:"#4CDCD6",biceps:"#D8ACE4",
  triceps:"#ECB053",quads:"#6FD39A",hams:"#7FC8C4",glutes:"#E7A9BC",
  calves:"#AABCCF",abs:"#D4C264",other:"#A9C1CD"};
const mcol=e=>MCOL[e&&e.m]||MCOL.other;
const half=x=>x!==""&&x!==undefined&&x!==null;

/* every set of the exercise carries both numbers */
function exDone(s,e){
  const a=(s.ex||{})[e.id]||[];
  for(let i=0;i<e.s;i++) if(!filled(a[i])) return false;
  return e.s>0;
}
/* he started it: any box anywhere has something in it */
function exTouched(s,e){

}
const isSkipped=(s,e)=>Array.isArray(s.skip)&&s.skip.indexOf(e.id)>=0;

/* kilos actually moved today: weight × reps over every finished set */
/* The last session on this day that actually holds numbers. prevSess() accepts a
   session that only has an exercise key, and his log has several of those — opening
   the app on a day is enough to make one. They are not sessions to measure against. */
function prevReal(){
  const t=iso(), ss=logs(day).sessions;
  for(let i=ss.length-1;i>=0;i--){
    const x=ss[i];
    if(!x||x.date>=t||!x.ex) continue;
    if(Object.keys(x.ex).some(k=>(x.ex[k]||[]).some(filled))) return x;
  }
  return null;
}
function sessVol(s){
  let v=0;
  Object.keys((s||{}).ex||{}).forEach(k=>((s.ex[k])||[]).forEach(x=>{
    if(!filled(x)) return;
    const w=+x[0], r=+x[1];
    if(isFinite(w)&&isFinite(r)) v+=w*r;
  }));
  return Math.round(v);
}
function sessSets(s){
  let n=0;
  Object.keys((s||{}).ex||{}).forEach(k=>((s.ex[k])||[]).forEach(x=>{ if(filled(x)) n++; }));
  return n;
}
function sessReps(s){
  let n=0;
  Object.keys((s||{}).ex||{}).forEach(k=>((s.ex[k])||[]).forEach(x=>{
    if(filled(x)){ const r=+x[1]; if(isFinite(r)) n+=r; } }));
  return n;
}
/* minutes between the first number typed and the last — nothing to start or stop */
function sessMins(s){
  if(!s||!s.t0||!s.t1||s.t1<=s.t0) return null;
  return Math.max(1,Math.round((s.t1-s.t0)/60000));
}

/* exercises whose best set today beats everything logged before today */
function sessPRs(s,dayId){
  const out=[], p=dayId?planOf(dayId):plan();
  const dk=dayId||day;
  (p?p.ex:[]).forEach(e=>{
    const sets=((s.ex||{})[e.id]||[]).filter(filled);
    if(!sets.length) return;
    let best=0,bw=0,br=0;
    sets.forEach(x=>{
      const w=+x[0], r=+x[1];
      if(!isFinite(w)||!isFinite(r)||!w) return;
      const v=e1rm(w,r);
      if(v>best){ best=v; bw=w; br=r; }
    });
    if(!best) return;
    const prior=exSeries(dk,e.id).filter(x=>x.date!==s.date);
    if(!prior.length) return;   /* the first time you do something is not a record */
    const top=prior.reduce((a,b)=>b.e>a.e?b:a,prior[0]).e;
    if(best>top+0.001) out.push({id:e.id,n:e.n,w:bw,r:br});
  });
  return out;
}
const isPRex=(s,id)=>sessPRs(s).some(x=>x.id===id);

/* what is still stopping the day from closing.
   hard: he started the exercise and left a box empty — that is a forgotten number.
   soft: he never touched it at all — that is a skip, and he says so himself. */
function dayGaps(){
  const p=plan(), s=todaySess(), hard=[], soft=[];
  (p?p.ex:[]).forEach((e,ei)=>{
    if(isSkipped(s,e)) return;
    const a=(s.ex||{})[e.id]||[];
    if(!exTouched(s,e)){ soft.push({ei:ei,id:e.id,n:e.n}); return; }
    for(let i=0;i<e.s;i++){
      const x=a[i]||["",""];
      const w=half(x[0]), r=half(x[1]);
      if(w&&r) continue;
      hard.push({ei:ei,si:i,id:e.id,n:e.n,
        why:w?"weight written, reps empty":r?"reps written, weight empty":"both boxes empty"});
    }
  });
  return {hard:hard,soft:soft};
}

/* ================= the home screen ================= */
const planOf=id=>store.program.find(p=>p.id===id);

/* Sunday 00:00 of the week we are in */
function weekStart(back){
  const d=new Date(); d.setHours(0,0,0,0);
  d.setDate(d.getDate()-d.getDay()-7*(back||0));
  return d;
}
const sessHas=s=>!!s&&!!s.ex&&Object.keys(s.ex).some(k=>(s.ex[k]||[]).some(filled));

/* the last session on a given day that actually holds numbers */
function lastReal(dayId){
  const ss=((store.days||{})[dayId]||{}).sessions||[];
  for(let i=ss.length-1;i>=0;i--) if(sessHas(ss[i])) return ss[i];
  return null;
}
const daysAgo=d=>Math.floor((Date.now()-t0(d))/864e5);

/* every session this week, across every day */
function weekSessions(back){
  const from=iso(weekStart(back)), to=iso(weekStart((back||0)-1));
  const out=[];
  Object.keys(store.days||{}).forEach(id=>{
    (((store.days[id]||{}).sessions)||[]).forEach(s=>{
      if(sessHas(s)&&s.date>=from&&s.date<to) out.push(s);
    });
  });
  return out;
}
const weekVol=back=>weekSessions(back).reduce((a,s)=>a+sessVol(s),0);

/* records broken this week, counted across all four days */
function weekPRs(){
  const from=iso(weekStart());
  let n=0;
  (store.program||[]).forEach(p=>{
    (((store.days||{})[p.id]||{}).sessions||[]).forEach(s=>{
      if(!sessHas(s)||s.date<from) return;
      n+=sessPRs(s,p.id).length;
    });
  });
  return n;
}

/* where each training day stands */
function dayCard(p){
  const last=lastReal(p.id), from=iso(weekStart());
  const done=last&&last.date>=from;
  const ago=last?daysAgo(last.date):null;
  let badge="", flag="";
  if(done) badge='<span class="badge ok">DONE</span>';
  else if(ago===null) badge='<span class="badge due">NEW</span>';
  else if(ago>10){ badge='<span class="badge late">'+ago+' DAYS</span>'; flag=" flag"; }
  else badge='<span class="badge due">DUE</span>';
  const mc=p.ex&&p.ex.length?mcol(p.ex[0]):"#A9C1CD";
  const foot=last
    ? '<b>'+sessVol(last).toLocaleString()+'</b> kg · '+fmt(last.date)
    : 'not logged yet';
  return '<button class="tile'+flag+'" style="--mc:'+mc+'" onclick="GYM4.go(\''+p.id+'\')">'+
    badge+'<div class="dn">'+esc(p.day)+'</div><div class="sp">'+esc(p.label)+'</div>'+
    '<div class="ft">'+foot+'</div></button>';
}

function homeView(){
  const from=iso(weekStart());
  const prog=store.program||[];
  const doneWk=prog.filter(p=>{ const l=lastReal(p.id); return l&&l.date>=from; }).length;
  const todayId={0:"sun",2:"tue",3:"wed",5:"fri"}[new Date().getDay()];
  const todayPlan=todayId?planOf(todayId):null;

  /* the hero: what today is, and the one thing to do about it */
  let k,h2,sub,cta,ctaId,rest="";
  if(todayPlan){
    const s=(((store.days||{})[todayId]||{}).sessions||[]).find(x=>x.date===iso());
    const did=s?prog.find(p=>p.id===todayId).ex.filter(e=>exDone(s,e)).length:0;
    const tot=todayPlan.ex.length;
    k="Today · "+esc(todayPlan.day);
    h2=esc(todayPlan.label);
    sub=s&&s.closed ? "Closed for today. "+sessVol(s).toLocaleString()+" kg moved."
      : did ? "<b>"+did+" of "+tot+"</b> exercises done."
      : tot+" exercises waiting.";
    cta=(s&&s.closed?"Open ":did?"Carry on with ":"Start ")+esc(todayPlan.day);
    ctaId=todayId;
  }else{
    /* a rest day points at whichever day has waited longest */

    prog.forEach(p=>{ const l=lastReal(p.id); const a=l?daysAgo(l.date):999;
      if(a>wa){ wa=a; worst=p; } });
    k="Today · "+["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"][new Date().getDay()];
    h2="Rest day"; rest=" rest";
    sub=worst?("Next up is <b>"+esc(worst.day)+" · "+esc(worst.label)+"</b>"+
        (wa<900?" — "+wa+" days since the last one.":".")):"Nothing scheduled.";
    cta=worst?("Open "+esc(worst.day)+" · "+esc(worst.label)):"";
    ctaId=worst?worst.id:null;
  }
  const C=2*Math.PI*35, pc=prog.length?doneWk/prog.length:0;
  const hero='<div class="hero'+rest+'"><div class="hro">'+
    '<div class="wkr"><svg width="84" height="84" viewBox="0 0 84 84" aria-hidden="true">'+
      '<circle cx="42" cy="42" r="35" fill="none" stroke="rgba(255,255,255,.12)" stroke-width="7"/>'+
      (pc>0?'<circle cx="42" cy="42" r="35" fill="none" stroke="#86E8E2" stroke-width="7"'+
        ' stroke-linecap="round" stroke-dasharray="'+C.toFixed(1)+'"'+
        ' stroke-dashoffset="'+(C*(1-pc)).toFixed(1)+'" transform="rotate(-90 42 42)"/>':'')+
      '</svg>'+
      '<div class="c"><div><b>'+doneWk+'<s>/'+prog.length+'</s></b><i>this week</i></div></div></div>'+
    '<div class="tx"><div class="k">'+k+'</div><h2>'+h2+'</h2><div class="s">'+sub+'</div></div>'+
    '</div>'+
    (ctaId?'<button class="go" onclick="GYM4.go(\''+ctaId+'\')">'+cta+'</button>':'')+
    '</div>';

  /* food */
  const t=eatTotal(), g=dietOf(new Date());
  const left=Math.round(g.k-t.k), pct=g.k?Math.round(t.k/g.k*100):0;
  const FC=2*Math.PI*28, fp=Math.max(0,Math.min(1,g.k?t.k/g.k:0));
  const food='<button class="tile food" style="--mc:#ECB053" onclick="GYM4.go(\'fd\')">'+
    '<div class="ring"><svg width="66" height="66" viewBox="0 0 66 66" aria-hidden="true">'+
      '<circle cx="33" cy="33" r="28" fill="none" stroke="#3A6880" stroke-width="7"/>'+
      '<circle cx="33" cy="33" r="28" fill="none" stroke="#ECB053" stroke-width="7" stroke-linecap="round"'+
        ' stroke-dasharray="'+FC.toFixed(1)+'" stroke-dashoffset="'+(FC*(1-fp)).toFixed(1)+'"'+
        ' transform="rotate(-90 33 33)"/></svg>'+
      '<span class="n">'+pct+'%</span></div>'+
    '<div class="b"><div class="dn lbl">Food</div><div class="big">'+Math.abs(left).toLocaleString()+
      '<s>kcal '+(left<0?"over":"left")+'</s></div>'+
      '<span class="pill">'+(g.heavy?"High":"Light")+' carb day</span>'+
      '<div class="m"><span>P <i>'+Math.round(t.p)+'/'+g.p+'</i></span>'+
        '<span>F <i>'+Math.round(t.f)+'/'+g.f+'</i></span>'+
        '<span>C <i>'+Math.round(t.b)+'/'+g.b+'</i></span></div></div></button>';

  /* stats */
  const np=weekPRs();
  const stats='<button class="tile" style="--mc:#4CDCD6" onclick="GYM4.go(\'st\')">'+
    '<div class="dn">Stats</div><div class="sp">Records</div>'+
    '<div class="ft"><b>'+np+'</b> PR'+(np===1?"":"s")+' this week</div></button>';

  /* plan */
  const pcH=planCalc();
  const plb=pcH.warn==="burn"||pcH.warn==="weigh"?'<span class="badge due">SET UP</span>':'';
  const plan_=' <button class="tile" style="--mc:#4CDCD6" onclick="GYM4.go(\'pl\')">'+plb+
    '<div class="dn">Plan</div><div class="sp">Targets</div>'+
    '<div class="ft">'+(pcH.ok
      ? '<b>'+pcH.kcal.toLocaleString()+'</b> kcal \u00b7 '+
        (pcH.goal==="hold"?"holding":pcH.goal==="gain"?"gaining":"cutting")
      : 'not set up yet')+'</div></button>';

  /* body */
  const ws=(store.weights||[]).filter(x=>x&&isFinite(+x.v)).slice().sort((a,b)=>a.d<b.d?-1:1);
  const lw=ws.length?ws[ws.length-1]:null;
  const wAgo=lw?daysAgo(lw.d):null;
  const wb=lw===null||wAgo===null?'<span class="badge due">NEW</span>'
    :wAgo>=7?'<span class="badge late">'+wAgo+' D</span>'

  /* the week in one line */
  const v1=weekVol(0), v0=weekVol(1);
  let wl="";
  if(v1>0){
    const d=v0>0?Math.round((v1-v0)/v0*100):null;
    wl='<div class="wkline"><span class="v">'+v1.toLocaleString()+'</span>'+
      '<span class="t">kg moved this week</span>'+
      (d===null?'':'<span class="d'+(d<0?' dn2':'')+'">'+(d>=0?"+":"")+d+'%</span>')+'</div>';
  }

  return '<div class="hw">'+hero+
    '<h3 class="hh">Training</h3><div class="hgrid">'+prog.map(dayCard).join("")+'</div>'+
    '<h3 class="hh">Today</h3><div class="hgrid">'+food+plan_+stats+body+'</div>'+
    wl+'</div>';
}

/* ---------- the strip that moves while he trains ---------- */
function liveStrip(p,s){ return '<div id="g4live">'+liveBits(p,s)+'</div>'; }
function liveBits(p,s){
  const done=p.ex.filter(e=>exDone(s,e)).length;
  const vol=sessVol(s), prs=sessPRs(s).length;
  const tot=p.ex.length||1;
  const pct=Math.round(done/tot*100);
  const pv=prevReal();
  const pvol=pv?sessVol(pv):0;
  let vs="";
  if(pvol>0&&vol===0){
    /* nothing logged yet, so there is nothing to be behind on — give him the target */
    vs='<div class="vsline"><i>Last '+esc(p.day)+' you moved '+pvol.toLocaleString()+' kg</i></div>';
  }else if(pvol>0){
    const d=vol-pvol;
    vs='<div class="vsline'+(d>=0?' up':'')+'">'+
      (d>=0?'Ahead of last '+esc(p.day)+' by '+Math.abs(d).toLocaleString()+' kg'
           :Math.abs(d).toLocaleString()+' kg to go to beat last '+esc(p.day))+
      ' <i>'+pvol.toLocaleString()+' kg then</i></div>';
  }
  return '<div class="live">'+
      '<div><div class="v on">'+done+'<s>/'+p.ex.length+'</s></div><div class="l">Exercises</div></div>'+
      '<div><div class="v">'+vol.toLocaleString()+'</div><div class="l">kg lifted</div></div>'+
      '<div><div class="v'+(prs?' gold':'')+'">'+prs+'</div><div class="l">PR today</div></div>'+
    '</div>'+
    '<div class="sprog"><i style="width:'+pct+'%"></i></div>'+vs;
}


/* ---------- an exercise that is finished, or not reached yet ---------- */
function miniView(e,ei,s){
  const open='onclick="GYM4.openOne(\''+e.id+'\')"';
  if(isSkipped(s,e))
    return '<section class="ex sk" style="--mc:'+mcol(e)+'" '+open+'>'+
      '<div class="up"><span class="idx">—</span><span class="nm">'+esc(e.n)+'</span>'+
      '<span class="tg">skipped</span></div></section>';
  if(exDone(s,e)){
    const a=(s.ex[e.id]||[]).filter(filled);
    const w=a.length?a[0][0]:"";
    const same=a.every(x=>x[0]===w);
    const res=same?'<b>'+esc(w)+'</b>kg × '+a.map(x=>esc(x[1])).join(",")
                  :a.map(x=>'<b>'+esc(x[0])+'</b>×'+esc(x[1])).join(" · ");
    return '<section class="ex cmp" style="--mc:'+mcol(e)+'" '+open+'>'+
      '<div class="done"><span class="dn">✓</span><span class="nm">'+esc(e.n)+'</span>'+
      (isPRex(s,e.id)?'<span class="prb">PR</span>':'')+
      '<span class="res">'+res+'</span></div></section>';
  }
  return '<section class="ex pend" style="--mc:'+mcol(e)+'" '+open+'>'+
    '<div class="up"><span class="idx">'+(ei+1)+'</span><span class="nm">'+esc(e.n)+'</span>'+
    '<span class="tg">'+e.s+' × '+esc(e.r)+'</span></div></section>';
}

/* ---------- the bar that ends the day ---------- */
function closeBar(p,s){
  if(!p.ex.length) return "";
  const g=dayGaps(), n=g.hard.length+g.soft.length;
  return '<div class="closebar">'+
    '<button class="closebtn'+(n?'':' ready')+'" onclick="GYM4.closeDay()">'+
      'Close the day'+(n?' · '+n+' left':'')+'</button>'+
    '<div class="closenote">'+(n?'Something is still empty — tap to see what'
      :'Locks today so nothing can change by accident')+'</div></div>';
}

/* ---------- a day that has been closed ---------- */
function closedView(p,s){
  const vol=sessVol(s), prs=sessPRs(s), mins=sessMins(s);
  const when=s.closed?new Date(s.closed):null;
  const hh=when?String(when.getHours()).padStart(2,"0")+":"+String(when.getMinutes()).padStart(2,"0"):"";
  const rows=p.ex.map(e=>{
    if(isSkipped(s,e)||!exTouched(s,e))
      return '<div class="rowq sk"><span class="nm">'+esc(e.n)+'</span><span class="rs">skipped</span></div>';
    const a=(s.ex[e.id]||[]).filter(filled);
    if(!a.length) return "";
    const w=a[0][0], same=a.every(x=>x[0]===w);
    const res=same?'<b>'+esc(w)+'</b>kg × '+a.map(x=>esc(x[1])).join(",")
                  :a.map(x=>'<b>'+esc(x[0])+'</b>×'+esc(x[1])).join(" · ");
    return '<div class="rowq">'+(isPRex(s,e.id)?'<span class="prb">PR</span>':'')+
      '<span class="nm">'+esc(e.n)+'</span><span class="rs">'+res+'</span></div>';
  }).join("");
  const did=sessSets(s);
  return '<div class="locked'+(did?'':' none')+'"><div class="hl2"><span>'+(did?'✓':'—')+'</span>'+
    esc(p.day)+' · '+esc(p.label)+' is closed</div>'+
    '<div class="s">'+(did
      ? 'Logged '+fmt(s.date)+(hh?" at "+hh:"")+(mins?" · "+mins+" minutes":"")+
        '. Nothing here can change by accident any more.'
      : 'Closed '+fmt(s.date)+' with nothing logged. It counts as a day off, not a session.')+'</div>'+
    '<div class="st">'+
      '<div><div class="v">'+vol.toLocaleString()+'</div><div class="l">kg lifted</div></div>'+
      '<div><div class="v">'+sessSets(s)+'</div><div class="l">sets</div></div>'+
      '<div><div class="v">'+prs.length+'</div><div class="l">PRs</div></div>'+
    '</div>'+
    '<button class="reopen" onclick="GYM4.reopenDay()">Reopen the day</button></div>'+
    '<h3 class="qh">What you logged</h3>'+rows+
    '<div class="hint">This day opens as normal next week — closing locks this date only.</div>';
}

function render(){
  const m=$("g4main");
  latCache={};
  const warn=Store.ok?"":'<div class="warn">Saving is not available here. Open this in Safari so your logs persist.</div>';
  const nav=$("g4nav");
  if(nav){
    nav.textContent=home?"ta":"\u2039";
    nav.className="nav"+(home?" logo":"");
    nav.setAttribute("aria-label",home?"Home":"Back to home");
  }
  if(home){
    const hh=new Date().getHours();
    $("g4h1").removeAttribute("dir"); $("g4h2").removeAttribute("dir");
    $("g4h1").textContent="TAREK";
    $("g4h2").textContent=(hh<12?"Good morning":hh<18?"Good afternoon":"Good evening")+
      " \u00b7 "+fmt(iso());
    $("g4edit").style.display="none";
    m.innerHTML=warn+backupBanner()+homeView();
    return;
  }
  const eb=$("g4edit");
  /* only the Plan screen is Arabic, so the header goes back to LTR everywhere else */
  if(day!=="pl"){ $("g4h1").removeAttribute("dir"); $("g4h2").removeAttribute("dir"); }
  eb.style.display=(day==="st"||day==="bd"||day==="pl")?"none":"";
  eb.setAttribute("data-on",editing?"1":"0");
  eb.textContent=editing?"Done":"Edit";

  if(day==="pl"){
    const pc=planCalc(), t=+(store.diet||{}).tgtkg||0;
    $("g4h1").textContent="\u0627\u0644\u062e\u0637\u0629";
    $("g4h2").innerHTML=(pc.kg&&t)
      ? '\u0645\u0646 '+AN(r1(pc.kg))+' \u0644\u0640 '+AN(r1(t))+' \u0643\u062c\u0645'+
        (pc.rate?' \u00b7 '+AN(pc.rate)+' \u0643\u062c\u0645 \u0643\u0644 \u0623\u0633\u0628\u0648\u0639':'')
      : (pc.goal==="hold"?"\u062b\u0627\u0628\u062a":pc.goal==="gain"?"\u062a\u0636\u062e\u064a\u0645":"\u062a\u0646\u0634\u064a\u0641")+
        (pc.rate?' \u00b7 '+AN(pc.rate)+' \u0643\u062c\u0645 \u0643\u0644 \u0623\u0633\u0628\u0648\u0639':'');
    $("g4h1").setAttribute("dir","rtl"); $("g4h2").setAttribute("dir","rtl");
    m.innerHTML=warn+backupBanner()+planView(); return;
  }
  if(day==="bd"){
    $("g4h1").textContent="Body";
    $("g4h2").textContent="Weight and measurements";
    m.innerHTML=warn+backupBanner()+bodyView(); return;
  }
  if(day==="st"){
    $("g4h1").textContent="Stats";
    $("g4h2").textContent="Records, volume, balance";
    m.innerHTML=warn+backupBanner()+statsView(); return;
  }

  if(day==="fd"){
    $("g4h1").textContent="Food";
    if(editing){
      $("g4h2").textContent="Editing, "+libOf().length+" items";
      m.innerHTML=warn+foodEditView();
    }else{
      const t=eatTotal();
      $("g4h2").textContent=fmt(iso())+" \u00b7 "+Math.round(t.k)+" kcal \u00b7 "+r1(t.p)+"g protein";
      m.innerHTML=warn+foodView();
    }
    return;
  }

  const p=plan();
  $("g4h1").innerHTML=esc(p.day)+' <em>'+esc(p.label)+'</em>';
  if(editing){
    $("g4h2").textContent="Editing, "+p.ex.length+" exercises";
    m.innerHTML=warn+
      '<div class="hint">Rename, reorder, delete, or change sets and reps. Muscle and head feed the volume and balance stats, so set them on any exercise you add. History follows the exercise, not its name.</div>'+
      p.ex.map((e,i)=>editView(e,i,p.ex.length)).join("")+
      '<button class="addex" onclick="GYM4.add()">+ Add exercise</button>';
  }else{
    const s=todaySess(), pv=prevSess();
    if(s.closed){
      $("g4h2").textContent=fmt(iso())+" · closed";
      m.innerHTML=warn+closedView(p,s);
      return;
    }
    const done=p.ex.filter(e=>exDone(s,e)).length;
    const mins=sessMins(s);
    $("g4h2").textContent=fmt(iso())+" · "+done+" of "+p.ex.length+" exercises"+
      (mins?" · "+mins+" min":"");
    if(!p.ex.length){
      m.innerHTML=warn+'<div class="hint">No exercises for this day. Tap Edit to add some.</div>';
      return;
    }
    /* One exercise is open at a time: the one he tapped, or else the first that
       is neither finished nor skipped. Everything else collapses to a line. */
    let liveId=(openId&&p.ex.some(e=>e.id===openId))?openId:null;
    if(!liveId){
      const nx=p.ex.find(e=>!exDone(s,e)&&!isSkipped(s,e));
      liveId=nx?nx.id:null;
    }
    m.innerHTML=warn+liveStrip(p,s)+backupBanner()+
      p.ex.map((e,i)=>e.id===liveId?logView(e,i,pv,s):miniView(e,i,s)).join("")+
      closeBar(p,s);
  }
}

function logView(e,ei,pv,s){
  const cur=s.ex[e.id]||[];
  const pr=prevFor(e.id);
  const ps=pr?pr.sets:null;
  const chips=ps
    ? '<span class="lbl">Last '+fmt(pr.date)+'</span>'+ps.filter(filled)
        .map(x=>'<span class="chip">'+esc(x[0])+'kg × '+esc(x[1])+(x[2]?' @'+esc(x[2]):'')+'</span>').join("")
    : '<span class="none">No previous log for this exercise</span>';

  // series excluding today, for suggestions
  const allS=exSeries(day,e.id);
  const past=allS.filter(p=>p.date!==iso());
  let cue="";
  const LT=latOf(e,day);
  const L=ps?nextLadder(ps,e.r,e.s,LT):null;
  if(L){
    cue+='<div class="next"><span class="lbl">Next</span>'+
      L.items.map(function(x){ return '<span class="chip">'+x.w+'kg × '+x.r+'</span>'; }).join("")+
      (L.mode==="rebuilt"?'<span class="nb">rebuilt so every set lands inside '+esc(e.r)+'</span>'
        :L.mode==="stepped"?'<span class="nb">new weights — match last time\'s reps, then build from there</span>'
        :L.mode==="capped"?'<span class="nb">the machine tops out here — add reps, not weight</span>':'')+
      /* only while the exercise is untouched, so it can never overwrite him */
      ((cur||[]).some(filled)?'':'<button class="fillnext" onclick="GYM4.fillNext('+ei+')">Fill these in</button>')+
      '</div>';
  }
  if(stalled(past)) cue+='<div class="cue hold"><div class="hl">Stalled — 3 sessions</div>'+
    '<div class="ex2">Same weight is not moving. Deload this week or swap the exercise.</div></div>';
  const flags=failureFlags(past,cur);
  if(flags.length) cue+='<div class="cue hold"><div class="hl">Stopping short?</div>'+
    '<div class="ex2">'+flags.slice(0,2).map(esc).join('<br>')+'</div></div>';

  let rows='<div class="shead"><span>#</span><span>Weight</span><span>Reps</span><span></span></div>';
  for(let i=0;i<e.s;i++){
    const c=cur[i]||["","",""], p=ps&&ps[i]?ps[i]:null;
    rows+='<div class="set" id="g4r-'+ei+'-'+i+'"><span class="n">'+(i+1)+'</span>'+
      '<div class="field'+(c[0]!==""&&c[0]!==undefined?" has":"")+'">'+
      '<input type="text" inputmode="decimal" step="0.5" value="'+esc(c[0]||"")+'"'+
        ' placeholder="'+(p?esc(p[0]):"")+'" oninput="GYM4.log('+ei+','+i+',0,this.value)"'+
        ' onfocus="GYM4.awake()" aria-label="Set '+(i+1)+' weight"><span class="unit">kg</span></div>'+
      '<div class="field'+(c[1]!==""&&c[1]!==undefined?" has":"")+'">'+

/* the calorie ring: one arc, drawn from the top, rounded, red once it is past the goal */
function fdRing(got,goal){
  const R=50, C=2*Math.PI*R;
  const p=goal>0?Math.min(1,got/goal):0;
  const over=got>goal;
  const left=goal-got;
  return '<div class="fring'+(over?" over":"")+'" onclick="GYM4.fdMacro(\'k\')">'+
    '<svg viewBox="0 0 120 120" aria-hidden="true">'+
      '<circle cx="60" cy="60" r="'+R+'" fill="none" stroke="var(--surface-2)" stroke-width="9"/>'+
      '<circle cx="60" cy="60" r="'+R+'" fill="none" stroke-width="9" stroke-linecap="round" '+
        'stroke="'+(over?"var(--rose)":"var(--aqua)")+'" '+
        'stroke-dasharray="'+(C*p).toFixed(1)+' '+C.toFixed(1)+'" '+
        'transform="rotate(-90 60 60)"/>'+
    '</svg>'+
    '<div class="rtx"><b>'+Math.abs(Math.round(left))+'</b>'+
      '<span>'+(over?"kcal over":"kcal left")+'</span></div></div>';
}
/* Protein is a floor to reach; fat and carbs are budgets not to pass. The badge
   says which side of that line he is on, so he stops doing the sum himself. */
function fdMac(key,cls,lab,v,go,unit,avg){
  const pct=go>0?Math.min(100,v/go*100):0;
  const over=v>go, d=Math.abs(v-go);
  const flag=(key!=="p")&&over;
  let badge="";
  if(over) badge=(key==="p")
    ? '<span class="d ok">\u2713</span>'
    : '<span class="d over">+'+r1(d)+'</span>';
  /* an untouched day does not need telling how far it is from everything */
  else if(d>=0.5&&v>0) badge='<span class="d under">\u2212'+r1(d)+'</span>';
  let mark="";
  if(avg&&go>0){
    const ap=Math.max(0,Math.min(100,avg/go*100));
    mark='<span class="avgm" style="left:'+ap.toFixed(1)+'%"></span>';
  }
  return '<div class="fm '+cls+'" onclick="GYM4.fdMacro(\''+key+'\')">'+
    '<div class="l"><i>'+lab+badge+'</i>'+
    '<b>'+r1(v)+' <em>/ '+r1(go)+(unit||"")+'</em></b></div>'+
    '<div class="pbar"><i class="'+(flag?"over":"")+'" style="width:'+pct.toFixed(1)+'%"></i>'+mark+'</div></div>';
}
/* colour each entry by whatever supplies most of its calories */
function fdTone(x){
  const p=(+x.p||0)*4, f=(+x.f||0)*9, b=(+x.b||0)*4;
  if(f>=p&&f>=b) return "f";
  if(b>=p&&b>=f) return "c";
  return "";
}

/* Carb cycling lives on the Plan screen now: it shapes the targets, it is not

function planCycleView(){

  let h='<h3 class="plh">توزيع الكارب</h3>'+

  h+='<div class="rate">'+[0,30,50,70].map(v=>
      '<button aria-pressed="'+(sh===v)+'" onclick="GYM4.fdShift('+v+')">'+
      (v?"+"+AN(v):"قافل")+'</button>').join("")+'</div>';
  h+='<div class="wk">'+WK.map((on,i)=>
      '<button class="wd'+(on?" on":"")+'" onclick="GYM4.fdDayLoad('+i+')">'+
      '<b>'+ARDAY[i]+'</b><em>'+(on?"تقيل":"خفيف")+'</em></button>').join("")+'</div>';

        AN(Math.round(tD.k))+' كالوري · '+AN(r1(tD.b))+' جم كارب</b></div>'+

      })()+'</b></div></div>';

/* ---------- the Plan screen ---------- */
function planRealView(pc){
  const R=planReal(), needD=Math.max(0,5-R.days), needW=Math.max(0,2-R.weighs);
  let h='<div class="plreal'+((needD||needW)?" thin":"")+'">'+
    '<div class="plrt">الوضع الحقيقي · آخر '+arDays(14)+'</div><div class="plrg">'+
    '<div><b>'+(R.days?AN(Math.round(R.avg).toLocaleString()):"—")+'</b>'+
      '<span>'+(R.days?"كالوري أكلتهم في اليوم":"لسه مسجلتش حاجة")+'</span></div>'+
    '<div><b class="'+(R.dkg===null?"":R.dkg<0?"dn":R.dkg>0?"up":"")+'">'+
      (R.dkg===null?"—":AN((R.dkg>0?"+":"")+r1(R.dkg))+" كجم")+'</b>'+
      '<span>'+(R.dkg===null?"محتاج وزنتين":"اللي الميزان عمله")+'</span></div></div>';
  if(needD||needW){
    const want=[];
    if(needD) want.push("<b>"+arDays(needD)+" كمان</b> مسجلة");
    if(needW) want.push("<b>"+arWeighs(needW)+" كمان</b>");
    return h+'<p class="plrv">'+want.join(" و")+
      ' وأقولك الخطة اللي تحت ماشية ولا لأ.</p></div>';
  }
  if(!pc.ok) return h+'</div>';
  const gap=Math.round(R.avg-pc.kcal);
  const want=pc.goal==="hold"?0:(pc.goal==="lose"?-1:1)*pc.rate*R.span/7;
  let v;
  if(Math.abs(gap)<=75){
    v='إنت بتاكل اللي خططته. ';
    v+=(pc.goal==="hold")?'ثبّت كده.'
      :(Math.abs(R.dkg)<Math.abs(want)*0.6
        ? 'بس الميزان ماشي أبطأ من كده — استنى أسبوع كمان قبل ما تغيّر أي حاجة.'
        : 'والميزان موافق. سيبها زي ما هي.');
  }else if((gap>0)===(pc.goal!=="gain")){
    v='إنت بتاكل <b>'+AN(Math.abs(gap))+' كالوري '+(gap>0?"زيادة":"أقل")+
      '</b> عن هدفك كل يوم. الخطة سليمة — المشكلة في الأكل مش في الرقم.';
  }else{
    v='إنت بتاكل <b>'+AN(Math.abs(gap))+' كالوري '+(gap>0?"زيادة":"أقل")+
      '</b> عن هدفك، وده بيشد عكس اللي إنت اخترته.';
  }
  return h+'<p class="plrv">'+v+'</p></div>';
}

      'لو حسيت الجيم بقى تقيل، انزل للـ '+AN(pc.rate===0.75?"0.5":"0.25")+' كجم.</p>';
  }

  /* ---- what comes out ---- */
  if(pc.warn==="burn")
    h+='<div class="plgap">اكتب بتحرق كام في اليوم والباقي هيتملي لوحده. '+
      'لو مش عارف، '+AN(30)+' لـ '+AN(33)+' كالوري لكل كيلو من وزنك هو التخمين المعتاد — '+
      (kg?'يعني حوالي '+AN(Math.round(kg*31))+' ليك.':'ازن نفسك فوق وهيقولك.')+'</div>';
  else if(pc.warn==="weigh")
    h+='<div class="plgap">ازن نفسك فوق الأول. البروتين والدهون بيتحسبوا لكل كيلو من وزنك، '+
      'فمن غير وزن مفيش حاجة نبني عليها.</div>';
  else{
    h+='<div class="plout"><div class="plok">كُل كده في اليوم</div>'+
      '<div class="plkk">'+AN(pc.kcal.toLocaleString())+'<em>كالوري</em></div>'+
      '<div class="plmac">'+
        '<div class="p"><b>'+pc.p+'</b><span>بروتين جم</span></div>'+
        '<div class="f"><b>'+pc.f+'</b><span>دهون جم</span></div>'+
        '<div class="c"><b>'+pc.b+'</b><span>كارب جم</span></div></div>'+
      '<div class="plpkl">البروتين لكل كيلو من وزنك</div><div class="plpk">'+
        PPKS.map(v=>'<button aria-pressed="'+(Math.abs(v-pc.ppk)<0.001)+
          '" onclick="GYM4.plSet(\'ppk\','+v+')">'+v.toFixed(1)+'</button>').join("")+'</div>'+
      '<p class="plnote">الدهون ثابتة '+AN(pc.goal==="lose"?"0.8":"1.0")+
        ' جم لكل كيلو — حد أدنى للهرمونات. والكارب بياخد الباقي. '+
        'الرقم الوحيد اللي ليك فيه رأي هو البروتين.</p>';
    if(pc.warn==="floor")
      h+='<p class="plwarn">كده هينزل تحت '+AN(1200)+' كالوري، وده مبقاش كلام ينفذ. '+
        'اختار سرعة أبطأ.</p>';
    else if(pc.warn==="carb")
      h+='<p class="plwarn">كده الكارب هيبقى '+AN(pc.b)+' جم بس — مش كفاية تلعب بيها.'+
        (pc.fix?' <button class="pllink" onclick="GYM4.plSet(\'rate\','+pc.fix+')">'+
          'جرّب '+AN(pc.fix)+' كجم في الأسبوع</button>':' اختار سرعة أبطأ.')+'</p>';
    const same=Math.round(g.k)===pc.kcal&&Math.round(g.p)===pc.p&&
               Math.round(g.f)===pc.f&&Math.round(g.b)===pc.b;
    h+=same?'<p class="plnote done">✓ دول أهدافك فعلاً.</p>'
      :'<button class="plapply" onclick="GYM4.plApply()">خليهم أهدافي</button>';
    h+='</div>';
  }

  h+=planCycleView()+fdCoachView();
  return h+'</div>';
}

function statsView(){
  const now=Date.now();
  let rows="", any=false, ups=0, downs=0, flats=0, prs=[], stalls=[], m4=[];

  store.program.forEach(p=>{
    let inner="";
    p.ex.forEach((e,i)=>{
      const S=exSeries(p.id,e.id);
      if(!S.length) return;
      any=true;
      const last=S[S.length-1], prev=S.length>1?S[S.length-2]:null;
      const pr=S.reduce((a,b)=>b.e>a.e?b:a,S[0]);
      const isPR=S.length>1 && last.e>=pr.e-0.001;
      if(isPR) prs.push(e.n);
      const st=stalled(S);
      if(st) stalls.push(e.n);
      const f4=fourWeek(S,now);
      if(f4!==null) m4.push(f4);

      let tag='<span class="t new">first</span>';
      if(prev){
        const pct=((last.e-prev.e)/prev.e)*100;
        if(Math.abs(pct)<0.4){ tag='<span class="t flat">—</span>'; flats++; }
        else if(pct>0){ tag='<span class="t up">+'+pct.toFixed(1)+'%</span>'; ups++; }
        else { tag='<span class="t down">'+pct.toFixed(1)+'%</span>'; downs++; }
      }
      inner+='<div class="srow" onclick="GYM4.jump(\''+p.id+'\','+i+')">'+
        '<div class="sn">'+esc(e.n)+(isPR?' <span class="star">PR</span>':'')+(st?' <span class="stall">STALL</span>':'')+
          '<div class="sm">best '+pr.w+'kg × '+pr.r+' · '+S.length+' session'+(S.length>1?'s':'')+'</div></div>'+
        '<div class="sv">'+last.w+'×'+last.r+'</div>'+tag+'</div>';
    });
    if(inner) rows+='<h3>'+esc(p.day)+' · '+esc(p.label)+'</h3>'+inner;
  });

  if(!any) return '<div class="hint">Nothing logged yet. Once you log a couple of sessions this tab shows your records, weekly volume per muscle, push/pull balance and month-on-month change.</div>';

  /* ---- 4-week headline (#35) ---- */
  let head="";
  if(m4.length){
    const avg4=m4.reduce((a,b)=>a+b,0)/m4.length;
    head+='<h3>Last 4 weeks vs the 4 before</h3>'+
      '<div class="stat"><div><div class="k">Average change</div>'+
      '<div class="v '+(avg4>=0?"up":"down")+'">'+(avg4>=0?"+":"")+avg4.toFixed(1)+'%</div></div>'+
      '<div><div class="k">Exercises compared</div><div class="v">'+m4.length+'</div></div></div>'+
      '<p class="verdict">'+(avg4>=2
        ? '<b>Real progress.</b> A month-on-month gain is the only trend worth reading — week to week is mostly noise.'
        : avg4>=-1
          ? '<b>Holding steady.</b> Normal during a return from a layoff or a heavy work stretch. Watch it again in two weeks.'
          : '<b>Going backwards.</b> Recovery is the first thing to check: sleep, food, then training volume.')+'</p>';
  }else{
    head+='<div class="hint">Month-on-month comparison needs about 8 weeks of logs. It will appear here on its own.</div>';
  }

  /* ---- session-to-session summary ---- */
  head+='<h3>Latest session vs the one before</h3>'+
    '<div class="stat">'+
    '<div><div class="k">Improved</div><div class="v up">'+ups+'</div></div>'+
    '<div><div class="k">Same</div><div class="v">'+flats+'</div></div>'+
    '<div><div class="k">Down</div><div class="v '+(downs?"down":"")+'">'+downs+'</div></div></div>';
  if(prs.length) head+='<div class="hint">Personal records: '+prs.map(esc).join(", ")+'</div>';
  if(stalls.length) head+='<div class="warn"><b>Stalled 3 sessions:</b> '+stalls.map(esc).join(", ")+
    '. Deload these or swap them out.</div>';

  /* ---- weekly volume per muscle (#4) + heads (#42) ---- */
  const vol=weeklyVolume(now);
  const keys=Object.keys(vol).sort((a,b)=>vol[b].total-vol[a].total);
  if(keys.length){
    head+='<h3>Sets this week, per muscle</h3>';
    keys.forEach(k=>{
      const v=vol[k], tg=TARGET[k]||[6,16];
      let note="", cls="flat";
      if(v.total<tg[0]){ note="below "+tg[0]; cls="down"; }
      else if(v.total>tg[1]){ note="above "+tg[1]; cls="down"; }
      else { note="in range "+tg[0]+"-"+tg[1]; cls="up"; }
      const hk=Object.keys(v.heads).sort((a,b)=>v.heads[b]-v.heads[a]);
      const seg=hk.map((h,i)=>'<i style="width:'+((v.heads[h]/v.total)*100).toFixed(1)+'%;background:'+
        ["#4CDCD6","#ECB053","#8FBBE2","#EAAB9F","#AABCCF"][i%5]+'"></i>').join("");
      head+='<div class="srow plain"><div class="sn">'+(MUSCLES[k]||k)+
        '<div class="sm">'+hk.map(h=>esc(h)+" "+v.heads[h]).join(" · ")+'</div>'+
        '<div class="bar">'+seg+'</div></div>'+
        '<div class="sv">'+v.total+'</div><span class="t '+cls+'">'+note+'</span></div>';
    });
    head+='<p class="verdict">The coloured bar splits each muscle by which part of it you trained. '+
      'For your back that is width versus thickness, and width is the one you wanted more of.</p>';
  }

  /* ---- push / pull balance (#45) ---- */
  const pp=pushPull(now);
  if(pp.push||pp.pull){
    const r=pp.ratio;
    head+='<h3>Push / pull balance this week</h3>'+
      '<div class="stat"><div><div class="k">Push sets</div><div class="v">'+pp.push+'</div></div>'+
      '<div><div class="k">Pull sets</div><div class="v">'+pp.pull+'</div></div>'+
      '<div><div class="k">Pull ÷ push</div><div class="v '+(r===null?"":r>=1?"up":r>=0.8?"":"down")+'">'+
      (r===null?"—":r.toFixed(2))+'</div></div></div>'+
      '<p class="verdict">'+(r===null
        ? 'Log some pressing and pulling and this fills in.'
        : r>=1
          ? '<b>Balanced or pull-dominant.</b> Good, that is the safe side for shoulders.'
          : r>=0.8
            ? '<b>Slightly push-heavy.</b> Acceptable, but do not let it drift further.'
            : '<b>Push-heavy.</b> Pressing well above pulling is the most common setup behind shoulder pain. '+
              'You coach swimming, so your shoulders already carry load outside the gym. Add pulling volume.')+'</p>';
  }

  return head+'<h3>Every exercise</h3>'+rows+
    '<p class="verdict" style="margin-top:14px">Tap any exercise for its full history and chart.</p>';
}

/* ---- measurement fields: key, label, full-width, direction that is good ---- */
const MF=[
  ["neck","Neck",1,""],
  ["shoulder","Shoulders",1,"+"],
  ["chest","Chest",1,""],
  ["armR","Arm R",0,"+"],["armL","Arm L",0,"+"],
  ["waist","Waist",1,"-"],
  ["lowerab","Lower abs",1,"-"],
  ["hip","Hip",1,"-"],
  ["thighR","Thigh R",0,"+"],["thighL","Thigh L",0,"+"],
  ["calfR","Calf R",0,"+"],["calfL","Calf L",0,"+"]
];
/* records saved before the left/right split used these keys */
const MOLD={armR:"arm",thighR:"thigh",calfR:"calf"};
function mval(rec,k){
  if(!rec) return null;
  let v=rec[k];
  if((v===undefined||v===""||v===null)&&MOLD[k]) v=rec[MOLD[k]];
  v=parseFloat(v);
  return (isFinite(v)&&v>0)?v:null;
}
/* US Navy estimate for men: neck, waist, height. Off by 3-4 points in absolute
   terms, but the same formula every time, so the direction is trustworthy. */
function bfPct(rec){
  const w=mval(rec,"waist"), n=mval(rec,"neck"), h=parseFloat(store.height);
  if(!w||!n||!isFinite(h)||h<120||w<=n) return null;
  const L=x=>Math.log(x)/Math.LN10;
  const b=495/(1.0324-0.19077*L(w-n)+0.15456*L(h))-450;
  return (b>3&&b<60)?b:null;
}
function wNear(d){
  let best=null,bd=6;
  (store.weights||[]).forEach(e=>{
    const k=Math.abs(t0(e.d)-t0(d))/864e5;
    if(k<=5&&k<bd){ bd=k; best=+e.v; }
  });
  return best;
}
/* One restore point a day, taken the first time the app opens that day, so it
   holds the state from BEFORE anything today could go wrong. Keeps 30. */
const SNAP_KEEP=30;
async function dailySnap(){
  if(!Store.cloud||!window.FB||!window.FB.snap) return;
  const t=iso();
  if(store.snapDay===t) return;
  try{
    await window.FB.snap(t,JSON.stringify(store),store.ts||Date.now());
    store.snapDay=t; save();
  }catch(e){ return; }
  try{
    const l=await window.FB.snapList();
    for(let i=SNAP_KEEP;i<l.length;i++) await window.FB.snapDel(l[i].d);
  }catch(e){}
}

function measureReport(cur,ref,days){
  if(!cur) return "";
  if(!ref) return '<div class="rep"><p>First set saved. The report needs a second measurement to compare against.</p></div>';
  const P=[];
  const g=k=>{ const a=mval(ref,k), b=mval(cur,k); return (a!==null&&b!==null)?b-a:null; };
  const wk=Math.max(days,1)/7;
  const dWa=g("waist");
  const limb=["armR","armL","thighR","thighL"].map(g).filter(x=>x!==null);
  const limbAvg=limb.length?limb.reduce((a,b)=>a+b,0)/limb.length:null;
  const kNow=wNear(cur.d), kRef=wNear(ref.d);
  const dKg=(kNow!==null&&kRef!==null)?kNow-kRef:null;

  P.push('<p>Comparing <b>'+fmt(cur.d)+'</b> with <b>'+fmt(ref.d)+'</b>, '+days+' days apart.'+
    (days<10?' Short window: week-to-week noise is bigger than real change, so read this as a hint and trust the four-week gap.':'')+'</p>');

  if(limb.filter(x=>Math.abs(x)>1.5).length)
    P.push('<p class="warn"><b>Check that measurement.</b> An arm or thigh moved more than 1.5 cm. Limbs do not change that fast. Measure again before reading anything into it.</p>');
  if(dWa!==null&&Math.abs(dWa)/wk>1.2)
    P.push('<p class="warn"><b>The waist moved a lot.</b> More than 1.2 cm a week is water, a different tape position, or a very aggressive deficit.</p>');

  if(dWa!==null&&dKg!==null){
    const wD=dWa<=-0.3, wF=Math.abs(dWa)<0.3, wU=dWa>=0.3;
    const kD=dKg<=-0.3, kF=Math.abs(dKg)<0.3, kU=dKg>=0.3;
    if(wD&&kD) P.push('<p class="good"><b>Fat loss, on track.</b> Waist down '+Math.abs(dWa).toFixed(1)+' cm, weight down '+Math.abs(dKg).toFixed(1)+' kg. That is the pattern you want.</p>');
    else if(kD&&wF) P.push('<p><b>Weight down, waist flat.</b> Most of that is water and glycogen rather than fat. Give it two more weeks before changing anything.</p>');
    else if(kF&&wD) P.push('<p class="good"><b>Recomposition.</b> The waist came down while the scale held. Fat off, muscle on. Leave the intake alone.</p>');
    else if(kU&&wU) P.push('<p class="warn"><b>Gaining fat.</b> Waist and weight both up: you are above maintenance. Cut about 300 calories a day.</p>');
    else if(kF&&wF) P.push('<p class="warn"><b>Nothing is moving.</b> Neither the waist nor the scale changed, so the deficit is not there. Cut about 300 calories a day, or add walking.</p>');
    else if(kD&&wU) P.push('<p class="warn"><b>These two disagree.</b> Weight down with the waist up is not normal. Re-measure at the navel, relaxed, without pulling the tape.</p>');
  } else if(dWa!==null){
    P.push('<p><b>Waist '+(dWa<0?"down ":"up ")+Math.abs(dWa).toFixed(1)+' cm.</b> Log your weight on measurement day and the report can tell you whether that is fat or water.</p>');
  }

  if(dKg!==null&&wk>=0.8){
    const gw=Math.round((dKg/wk)*1000);
    if(gw<=-350&&gw>=-700) P.push('<p class="good"><b>The rate is right.</b> '+Math.abs(gw)+' g a week is the band that keeps muscle.</p>');
    else if(gw<-700) P.push('<p class="warn"><b>Too fast.</b> '+Math.abs(gw)+' g a week. Past 700 g you pay in muscle, more so on short sleep. Add 200-300 calories a day.</p>');
    else if(gw<0) P.push('<p><b>Slow.</b> '+Math.abs(gw)+' g a week. Cut about 200 calories a day if you want it to move.</p>');
  }

  if(dWa!==null&&dWa<=-0.3&&limbAvg!==null){
    if(limbAvg>=-0.3) P.push('<p class="good"><b>Muscle held.</b> The waist came down and the arms and thighs did not. That is fat loss, not weight loss.</p>');
    else if(limbAvg<=-0.6) P.push('<p class="warn"><b>The limbs are shrinking with the waist.</b> Arms and thighs down '+Math.abs(limbAvg).toFixed(1)+' cm on average. Either the deficit is too big or protein is short. Check the gym log: if the weights are falling too, it is the deficit.</p>');
  }

  [["armR","armL","arm"],["thighR","thighL","thigh"],["calfR","calfL","calf"]].forEach(pr=>{
    const a=mval(cur,pr[0]), b=mval(cur,pr[1]);
    if(a===null||b===null) return;
    const d=Math.abs(a-b);
    if(d>1.5) P.push('<p class="warn"><b>Side gap: '+pr[2]+' '+d.toFixed(1)+' cm.</b> Up to 1.5 cm between sides is normal in everyone. Past that, check the measuring point first, then whether one side is working harder.</p>');
  });

  const b1=bfPct(cur), b0=bfPct(ref);
  if(b1!==null&&b0!==null&&Math.abs(b1-b0)>=0.2)
    P.push('<p>Body fat estimate moved from <b>'+b0.toFixed(1)+'%</b> to <b>'+b1.toFixed(1)+'%</b>. The number itself can be off by 3-4 points, but it is the same formula every time, so the direction is reliable.</p>');

  return '<div class="rep">'+P.join("")+'</div>';
}

function bodyView(){
  const w=(store.weights||[]).slice().sort((a,b)=>a.d<b.d?1:-1);
  const now=Date.now();
  const inR=(e,f,t)=>{const x=t0(e.d);return x>now-t*864e5&&x<=now-f*864e5;};
  const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;
  const w1=avg(w.filter(e=>inR(e,0,7)).map(e=>e.v));
  const w2=avg(w.filter(e=>inR(e,7,14)).map(e=>e.v));
  const df=(w1!==null&&w2!==null)?w1-w2:null;
  let v="Log your weight 3-4 times a week, mornings on an empty stomach. Two weeks of data are needed before a comparison means anything.";
  if(df!==null){
    const g=Math.round(df*1000);
    if(g<=-350&&g>=-700)v="<b>On target.</b> You are losing 350-700 g a week, the rate that keeps muscle. Keep the same intake.";
    else if(g<-700)v="<b>Losing too fast.</b> Past about 700 g a week you start giving up muscle, more so on short sleep. Add 200-300 calories per day.";
    else if(g<0)v="<b>Losing too slowly.</b> Cut about 200 calories per day, or drop 50 g of rice from the post-gym meal.";
    else v="<b>Not losing.</b> You are at or above maintenance. Cut 300 calories per day.";
  }
  const wrows=w.slice(0,14).map(e=>'<div class="hrow"><span class="d">'+fmt(e.d)+'</span>'+
    '<span class="v">'+e.v.toFixed(1)+' kg</span>'+
    '<button class="x" onclick="GYM4.wdel(\''+e.d+'\')" aria-label="Delete">×</button></div>').join("");

  /* ---- measurements (#6) ---- */
  const M=(store.measures||[]).slice().sort((a,b)=>a.d<b.d?1:-1);
  const latest=M[0]||null;
  /* compare against the set nearest four weeks back, not simply the one before:
     measuring weekly makes consecutive sets too noisy to read. */
  let ref=null, refDays=0;
  if(latest&&M.length>1){
    const lt=t0(latest.d); let bs=1e9;
    for(let i=1;i<M.length;i++){
      const dd=Math.round((lt-t0(M[i].d))/864e5);
      if(dd<=0) continue;
      const sc=Math.abs(dd-28);
      if(sc<bs){ bs=sc; ref=M[i]; refDays=dd; }
    }
  }

  let mstat="";
  if(latest){
    const rows=MF.map(f=>{
      const cur=mval(latest,f[0]); if(cur===null) return "";
      const prev=mval(ref,f[0]);
      const d=(prev!==null)?cur-prev:null;
      let cls="";
      if(d!==null&&Math.abs(d)>=0.1&&f[3]) cls=((d<0)===(f[3]==="-"))?"up":"down";
      return '<div class="r"><span class="n">'+f[1]+'</span><span class="v">'+cur.toFixed(1)+'</span>'+
        '<span class="c '+cls+'">'+(d===null?"—":(Math.abs(d)<0.05?"0.0":(d>0?"+":"")+d.toFixed(1)))+'</span></div>';
    }).join("");
    if(rows) mstat='<p class="verdict" style="margin-bottom:0">Latest '+fmt(latest.d)+
      (ref?', change against '+fmt(ref.d):', no earlier set to compare with yet')+'.</p><div class="mlist">'+rows+'</div>';
    const wa=mval(latest,"waist"), hp=mval(latest,"hip"), bf=bfPct(latest);
    const whr=(wa&&hp)?wa/hp:null;
    mstat+='<div class="stat">'+
      '<div><div class="k">Body fat est.</div><div class="v">'+(bf!==null?bf.toFixed(1)+"%":"—")+'</div></div>'+
      '<div><div class="k">Waist ÷ hip</div><div class="v">'+(whr!==null?whr.toFixed(2):"—")+'</div></div></div>';
    if(bf===null) mstat+='<p class="verdict">The body fat estimate needs your height, neck and waist. Height is the last field below and you only set it once.</p>';
    else if(whr!==null) mstat+='<p class="verdict">For men, waist ÷ hip under 0.90 is the low-risk band, 0.90-0.99 moderate, 1.00 and over high. It says where the fat sits, not how much there is.</p>';
    mstat+=measureReport(latest,ref,refDays);
  }

  const minputs='<div class="mgrid">'+MF.map(f=>
    '<div'+(f[2]?' class="wide"':'')+'><label>'+f[1]+' (cm)</label><div class="field">'+
    '<input type="text" inputmode="decimal" step="0.1" id="g4m-'+f[0]+'" placeholder="'+
    (mval(latest,f[0])!==null?mval(latest,f[0]).toFixed(1):"–")+'" aria-label="'+f[1]+'"><span class="unit">cm</span></div></div>'
  ).join("")+
  '<div class="wide"><label>Height (cm), set once</label><div class="field">'+
  '<input type="text" inputmode="decimal" step="0.5" id="g4m-height" placeholder="'+
  (store.height?(+store.height).toFixed(0):"–")+'" aria-label="Height"><span class="unit">cm</span></div></div>'+
  '</div><button class="mfull" onclick="GYM4.madd()">Save measurements</button>';

  const mrows=M.slice(0,8).map(e=>{
    const bits=[], wa=mval(e,"waist"), ar=mval(e,"armR"), th=mval(e,"thighR");
    if(wa!==null) bits.push("Wa "+wa.toFixed(1));
    if(ar!==null) bits.push("Ar "+ar.toFixed(1));
    if(th!==null) bits.push("Th "+th.toFixed(1));
    return '<div class="hrow"><span class="d">'+fmt(e.d)+'</span><span class="v">'+(bits.join("  ")||"—")+'</span>'+
      '<button class="x" onclick="GYM4.mdel(\''+e.d+'\')" aria-label="Delete">×</button></div>';
  }).join("");

  /* ---- trend charts ---- */
  const wPts=w.slice().reverse().slice(-24).map(e=>({date:e.d,e:+e.v}));
  const sPts=M.slice().reverse().map(e=>({date:e.d,e:mval(e,"waist")})).filter(x=>x.e!==null).slice(-24);
  let charts="";
  if(wPts.length>1) charts+='<p class="clab">Weight (kg)</p>'+chartSVG(wPts,true);
  if(sPts.length>1) charts+='<p class="clab">Waist (cm)</p>'+chartSVG(sPts,true);
  if(charts) charts='<h3>Trend</h3>'+charts+
    '<p class="verdict" style="margin-top:12px">Each chart has its own scale, so read the shape and not the height.</p>';

  return '<h3>Body weight</h3>'+
    '<div class="wgrid"><div class="field"><input type="text" inputmode="decimal" step="0.1" id="g4w" '+
      'placeholder="'+(w.length?w[0].v.toFixed(1):"86.0")+'" aria-label="Weight today"><span class="unit">kg</span></div>'+
      '<button onclick="GYM4.wadd()">Log</button></div>'+
    '<div class="stat"><div><div class="k">Last 7 days</div><div class="v">'+(w1!==null?w1.toFixed(1):"—")+'</div></div>'+
    '<div><div class="k">Week before</div><div class="v">'+(w2!==null?w2.toFixed(1):"—")+'</div></div>'+
    '<div><div class="k">Change</div><div class="v '+(df===null?"":df<=0?"up":"down")+'">'+
      (df===null?"—":(df>=0?"+":"")+df.toFixed(2))+'</div></div></div>'+
    '<p class="verdict">'+v+'</p>'+wrows+
    '<h3>Measurements, weekly</h3>'+mstat+minputs+mrows+charts;
}

/* ---------- what you see the moment the day closes ---------- */
function finishBody(){
  const p=plan(), s=todaySess();
  const vol=sessVol(s), prs=sessPRs(s), mins=sessMins(s);
  const pv=prevReal(), pvol=pv?sessVol(pv):0;
  const sets=sessSets(s), reps=sessReps(s);
  const pct=pvol>0?Math.round((vol-pvol)/pvol*100):null;
  const r=58, C=2*Math.PI*r;
  const fillPct=pvol>0?Math.max(.08,Math.min(1,vol/Math.max(vol,pvol))):1;
  const ring='<div class="ring"><svg width="136" height="136" viewBox="0 0 136 136" aria-hidden="true">'+
    '<circle cx="68" cy="68" r="'+r+'" fill="none" stroke="#3A6880" stroke-width="11"/>'+
    '<circle cx="68" cy="68" r="'+r+'" fill="none" stroke="#4CDCD6" stroke-width="11" stroke-linecap="round"'+
      ' stroke-dasharray="'+C.toFixed(1)+'" stroke-dashoffset="'+(C*(1-fillPct)).toFixed(1)+'"'+
      ' transform="rotate(-90 68 68)"/></svg>'+
    '<div class="rl"><div><b>'+vol.toLocaleString()+'</b><i>kg lifted</i></div></div></div>';

  let vs="";
  if(pvol>0){
    const d=vol-pvol;
    const near=Math.abs(pct)<1;
    const big=near?(d>=0?"+":"−")+Math.abs(d).toLocaleString()+"<s>kg</s>"
                 :(pct>=0?"+":"")+pct+"%";
    vs='<div class="vs"><div class="big'+(near?' lvl':'')+'">'+big+'</div>'+
      '<div class="tx">'+(near?"Level with last ":d>0?"Heavier than last ":"Lighter than last ")+esc(p.day)+
      ' — <b>'+vol.toLocaleString()+' kg</b> against '+pvol.toLocaleString()+' kg.</div></div>';
  }

  const cell=(v,l,d)=>'<div class="cell"><div class="v">'+v+'</div><div class="l">'+l+'</div>'+
    (d?'<div class="d">'+d+'</div>':'')+'</div>';
  const grid='<div class="grid">'+
    cell(mins?mins+'<s> min</s>':'—',"Session","")+
    cell(sets,"Sets",pv?sessSets(pv)+" last time":"")+
    cell(reps,"Reps",pv?sessReps(pv)+" last time":"")+
    cell(sets?(reps/sets).toFixed(1):"0","Reps / set",
      pv&&sessSets(pv)?"was "+(sessReps(pv)/sessSets(pv)).toFixed(1):"")+
    '</div>';

  let pr="";
  if(prs.length) pr='<h3 class="qh">New records</h3>'+prs.map(x=>
    '<div class="prc"><span class="m">★</span><span class="n">'+esc(x.n)+'</span>'+
    '<span class="r">'+esc(x.w)+' kg × '+esc(x.r)+'</span></div>').join("");

  const rows=p.ex.map(e=>{
    if(isSkipped(s,e)||!exTouched(s,e))
      return '<div class="rowq sk"><span class="nm">'+esc(e.n)+'</span><span class="rs">skipped</span></div>';
    const a=(s.ex[e.id]||[]).filter(filled);
    if(!a.length) return "";
    const w=a[0][0], same=a.every(x=>x[0]===w);
    const res=same?'<b>'+esc(w)+'</b>kg × '+a.map(x=>esc(x[1])).join(",")
                  :a.map(x=>'<b>'+esc(x[0])+'</b>×'+esc(x[1])).join(" · ");
    return '<div class="rowq"><span class="nm">'+esc(e.n)+'</span><span class="rs">'+res+'</span></div>';
  }).join("");

  return '<div class="fin">'+ring+vs+grid+pr+
    '<h3 class="qh">Everything you logged</h3>'+rows+
    '<button class="finbtn" onclick="GYM4.closeSheet(this)">Back to the day</button></div>';
}

/* ---------- the panel that says what is still missing ---------- */
function gapBody(){
  const g=dayGaps(), s=todaySess();
  let h="";
  if(g.hard.length){
    h+='<div class="sheetc"><div class="sh"><div class="ttl">'+
      (g.hard.length===1?"One set is still empty":g.hard.length+" sets are still empty")+'</div>'+

        '<button class="go" onclick="GYM4.gapGo('+x.ei+','+x.si+')">Go</button></div>').join("")+
      '</div>';
  }
  if(g.soft.length){
    h+='<div class="sheetc skip"><div class="sh"><div class="ttl">'+
      (g.soft.length===1?"One exercise you never started":g.soft.length+" exercises you never started")+'</div>'+
      '<div class="s">If you did not do them today, mark them skipped and the day can close.</div></div>'+
      g.soft.map(x=>'<div class="gapr"><span class="ic">'+(x.ei+1)+'</span>'+
        '<div class="tx"><b>'+esc(x.n)+'</b><i>Nothing logged</i></div>'+
        '<button class="sw" role="switch" aria-checked="false" aria-label="Skip '+esc(x.n)+'"'+
        ' onclick="GYM4.skipEx(\''+x.id+'\')"></button></div>').join("")+
      '</div>';
  }
  const skipped=(plan().ex||[]).filter(e=>isSkipped(s,e));
  if(skipped.length){
    h+='<div class="sheetc skip"><div class="sh"><div class="ttl">Marked skipped</div>'+
      '<div class="s">Tap to put one back.</div></div>'+
      skipped.map(e=>'<div class="gapr"><span class="ic">—</span>'+
        '<div class="tx"><b>'+esc(e.n)+'</b><i>Will be logged as skipped</i></div>'+
        '<button class="sw on" role="switch" aria-checked="true" aria-label="Unskip '+esc(e.n)+'"'+
        ' onclick="GYM4.skipEx(\''+e.id+'\')"></button></div>').join("")+
      '</div>';
  }
  const n=g.hard.length+g.soft.length;
  h+='<div class="closebar"><button class="closebtn'+(n?'':' ready')+'" onclick="GYM4.closeDay()">'+
    'Close the day'+(n?' · '+n+' left':'')+'</button>'+
    '<div class="closenote">'+(n?'Fill what is above, or mark it skipped':'All clear — tap to close')+
    '</div></div>';
  return h;
}
